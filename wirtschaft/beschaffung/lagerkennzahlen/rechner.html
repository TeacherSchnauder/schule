<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lagerkennzahlen – Lernpfad zum Abitur | BPE 6.3</title>
<style>
:root{
  --blau:#1f5fa8; --blau-d:#174a83; --blau-h:#e8f0fa;
  --grau:#2b2f36; --grau-m:#5b6270; --grau-h:#f3f5f8; --linie:#d5dbe3;
  --gruen:#1e7b4a; --gruen-h:#e5f3ea; --rot:#b3261e; --rot-h:#fbeae8; --gelb:#7a5600; --gelb-h:#fff3d4;
  --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--grau);background:var(--grau-h);line-height:1.5;font-size:17px}
a{color:var(--blau)}
header.top{background:var(--grau);color:#fff}
header.top .in{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top .logo{font-weight:700;font-size:19px;letter-spacing:.2px;color:#fff;text-decoration:none}
header.top .logo small{display:block;font-weight:400;font-size:13px;color:#c9ced8}
header.top nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
header.top nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;border:1px solid #4a505b;font-size:15px}
header.top nav a.aktiv,header.top nav a:hover{background:var(--blau);border-color:var(--blau)}
.lehrkraft{background:var(--gelb-h);color:var(--gelb);border-bottom:1px solid #e9d49a;font-size:14px}
.lehrkraft .in{max-width:1040px;margin:0 auto;padding:8px 20px}
main{max-width:1040px;margin:0 auto;padding:20px}
h1{font-size:26px;margin:0 0 8px}
h2{font-size:22px;margin:0 0 10px}
h3{font-size:19px;margin:0 0 8px}
h4{font-size:17px;margin:0 0 8px}
.karte{background:#fff;border:1px solid var(--linie);border-radius:var(--r);padding:18px 20px;margin:0 0 16px}
.klein{font-size:14px;color:var(--grau-m)}
.fiktiv{font-size:13px;color:var(--grau-m);font-style:italic;margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blau);color:#fff;border:1px solid var(--blau);border-radius:8px;padding:9px 16px;font-size:16px;cursor:pointer;min-height:44px;text-decoration:none;font-family:inherit}
.btn:hover{background:var(--blau-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sek{background:#fff;color:var(--blau)}
.btn.sek:hover{background:var(--blau-h)}
.btn.klein{min-height:36px;padding:6px 12px;font-size:15px}
.aktionen{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.linkbtn{background:none;border:0;color:var(--grau-m);text-decoration:underline;cursor:pointer;font-size:14px;padding:6px;font-family:inherit}
.zurueck{display:inline-block;margin-bottom:10px;text-decoration:none;font-size:15px}
.badge{display:inline-block;background:var(--blau-h);color:var(--blau-d);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600;margin-right:6px;vertical-align:2px}
.badge.vert{background:var(--gelb-h);color:var(--gelb)}
.hinweis{border-radius:8px;padding:12px 14px;margin:10px 0;border:1px solid var(--linie);background:var(--grau-h)}
.hinweis.gut{background:var(--gruen-h);border-color:#b9dcc6}
.hinweis.schlecht{background:var(--rot-h);border-color:#efc2bc}
.hinweis.info{background:var(--blau-h);border-color:#c3d6ee}
.hinweis.vert{background:var(--gelb-h);border-color:#e9d49a}
.ziel{display:flex;gap:10px;align-items:flex-start}
/* Lernpfad */
ol.stufen{list-style:none;padding:0;margin:0 0 16px}
ol.stufen li{background:#fff;border:1px solid var(--linie);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center}
ol.stufen li.gesperrt{opacity:.6}
.nr{width:44px;height:44px;border-radius:50%;background:var(--blau-h);color:var(--blau-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px}
li.fertig .nr{background:var(--gruen);color:#fff}
li.gesperrt .nr{background:#e4e7ec;color:var(--grau-m)}
.balken{height:8px;background:#e4e7ec;border-radius:99px;overflow:hidden;margin-top:6px}
.balken i{display:block;height:100%;background:var(--blau);border-radius:99px}
li.fertig .balken i{background:var(--gruen)}
/* Tabs/Chips */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabs button,.chip{background:#fff;border:1px solid var(--linie);border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;color:var(--grau);font-family:inherit;min-height:40px}
.tabs button.aktiv,.chip.aktiv{background:var(--blau);color:#fff;border-color:var(--blau)}
.chip.erledigt{border-color:var(--gruen);color:var(--gruen)}
.chip.erledigt.aktiv{background:var(--gruen);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
/* Felder */
.felder{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.feld label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.eing{display:flex;align-items:center;gap:6px}
.eing input,input.std,select.std,textarea{width:100%;font-size:17px;padding:9px 10px;border:1px solid #b9c1cc;border-radius:7px;font-family:inherit;background:#fff;color:var(--grau)}
.eing .einh{font-size:15px;color:var(--grau-m);min-width:34px}
.feld .rm{font-size:14px;min-height:20px;margin-top:4px}
.feld.ok input{border-color:var(--gruen);background:var(--gruen-h)}
.feld.ok .rm{color:var(--gruen)}
.feld.folge input{border-color:#c79a2b;background:var(--gelb-h)}
.feld.folge .rm{color:var(--gelb)}
.feld.falsch input{border-color:var(--rot);background:var(--rot-h)}
.feld.falsch .rm{color:var(--rot)}
.loes{display:block;color:var(--grau);font-weight:600}
textarea{resize:vertical;line-height:1.45}
label.zeile{display:block;margin-bottom:10px;font-size:15px;font-weight:600}
label.zeile input,label.zeile select{margin-top:4px}
/* Tabellen */
.tab{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;margin:6px 0}
.tab th,.tab td{padding:6px 10px;border-bottom:1px solid var(--linie);text-align:left;vertical-align:top}
.tab th{background:var(--grau-h);font-size:14px}
.tab td.z,.tab th.z{text-align:right;white-space:nowrap}
.tabwrap{overflow-x:auto}
.tab tr.markiert td{background:var(--blau-h)}
/* MC */
.optionen{display:grid;gap:8px;margin:10px 0}
.opt{text-align:left;background:#fff;border:1px solid #b9c1cc;border-radius:8px;padding:11px 14px;font-size:16px;cursor:pointer;color:var(--grau);font-family:inherit;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--blau);background:var(--blau-h)}
.opt.ok{border-color:var(--gruen);background:var(--gruen-h)}
.opt.falsch{border-color:var(--rot);background:var(--rot-h)}
.opt:disabled{cursor:default}
.frage{font-weight:600;font-size:18px;margin:4px 0}
label.cb{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--linie);border-radius:8px;margin:6px 0;cursor:pointer;background:#fff}
label.cb input{width:20px;height:20px;margin-top:2px;flex:none}
label.cb.ok{border-color:var(--gruen);background:var(--gruen-h)}
label.cb.falsch{border-color:var(--rot);background:var(--rot-h)}
label.cb .warum{display:block;font-size:14px;color:var(--grau-m)}
/* Formeln */
.bruch{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:2px 4px}
.bruch .z{border-bottom:2px solid var(--grau);padding:0 8px 2px;text-align:center}
.bruch .n{padding:2px 8px 0;text-align:center}
.formel{font-size:17px;margin:8px 0}
.lernkarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.lk{background:#fff;border:1px solid var(--linie);border-radius:var(--r);padding:14px;min-height:150px;cursor:pointer;text-align:left;font-family:inherit;font-size:16px;color:var(--grau)}
.lk:hover{border-color:var(--blau)}
.lk .vorn{font-weight:700;color:var(--blau-d)}
.lk.offen{background:var(--blau-h)}
.bau{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.slot{min-height:58px;border:2px dashed #b9c1cc;border-radius:9px;padding:6px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;cursor:pointer;background:#fff;position:relative}
.slot.aktiv{border-color:var(--blau);background:var(--blau-h)}
.slot .sn{font-size:12px;font-weight:700;color:var(--grau-m);text-transform:uppercase;letter-spacing:.5px;margin-right:6px}
.strich{height:3px;background:var(--grau);border-radius:2px;margin:0 10px}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kachel{background:#fff;border:1px solid #9aa6b5;border-radius:8px;padding:7px 11px;font-size:15px;cursor:pointer;font-family:inherit;color:var(--grau);min-height:40px}
.kachel:hover:not(:disabled){border-color:var(--blau);background:var(--blau-h)}
.kachel:disabled{opacity:.3}
.kachel.gesetzt{background:var(--blau);color:#fff;border-color:var(--blau)}
.opbtn{background:var(--grau);color:#fff;border:0;border-radius:6px;width:34px;height:34px;font-size:18px;cursor:pointer}
/* Rechenweg */
.weg{border-left:3px solid var(--blau);padding-left:14px;margin:10px 0}
.schritt{margin-bottom:12px}
.schritt .t{font-weight:700}
.schritt .l{font-variant-numeric:tabular-nums}
details.wegbox summary{cursor:pointer;color:var(--blau);font-weight:600;padding:6px 0}
/* Prognose */
.prog{width:100%;border-collapse:collapse}
.prog td{padding:6px 4px;border-bottom:1px solid var(--linie)}
.pf{display:flex;gap:6px}
.pf button{width:48px;height:42px;border:1px solid #9aa6b5;background:#fff;border-radius:8px;font-size:20px;cursor:pointer;color:var(--grau)}
.pf button.gew{background:var(--blau);color:#fff;border-color:var(--blau)}
.pf button.richtig{outline:3px solid var(--gruen);outline-offset:1px}
.pf button.gew.falschgew{background:var(--rot);border-color:var(--rot)}
.regler label{display:block;margin:10px 0 2px;font-weight:600;font-size:15px}
.regler input[type=range]{width:100%;height:30px}
.gauge{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;margin:6px 0;font-size:15px}
.gauge .bar{height:14px;background:#e4e7ec;border-radius:99px;position:relative;overflow:visible}
.gauge .bar i{display:block;height:100%;background:var(--blau);border-radius:99px}
.gauge .bar b{position:absolute;top:-4px;width:2px;height:22px;background:var(--grau)}
.gauge .wert{text-align:right;font-variant-numeric:tabular-nums}
/* Planspiel */
.massn{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:10px 0}
.mk{text-align:left;background:#fff;border:1px solid #9aa6b5;border-radius:10px;padding:12px;font-family:inherit;font-size:15px;color:var(--grau);cursor:pointer;line-height:1.4}
.mk strong{display:block;font-size:16px;margin-bottom:4px}
.mk.gew{border:2px solid var(--blau);background:var(--blau-h)}
.mk:disabled{opacity:.45;cursor:not-allowed}
.status{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:8px 0}
.status div{background:var(--grau-h);border-radius:8px;padding:8px 10px;font-size:14px}
.status div b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.sterne{font-size:30px;letter-spacing:4px}
.besser{color:var(--gruen);font-weight:600}
.schlechter{color:var(--rot);font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.raster2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fuss{text-align:center;margin:20px 0 40px}
@media (max-width:760px){
  .raster2{grid-template-columns:1fr}
  ol.stufen li{grid-template-columns:44px 1fr}
  ol.stufen li .rechts{grid-column:1/-1}
  .gauge{grid-template-columns:1fr;gap:2px}
  .gauge .wert{text-align:left}
  main{padding:14px}
}
@media print{header.top,.lehrkraft,.aktionen,.fuss,.zurueck{display:none}body{background:#fff}.karte{border:1px solid #999}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="#home">Lagerkennzahlen<small>Lernpfad zum Abitur · VBL BPE 6.3</small></a>
  <nav id="nav"></nav>
</div></header>
<div id="lehrkraftleiste"></div>
<main id="main"></main>

<script>
"use strict";
/* =========================================================
   Lagerkennzahlen – Lernpfad (BPE 6.3, Wirtschaftsgymnasium BW)
   Reines HTML/CSS/JavaScript, keine externen Abhängigkeiten.
   Fortschritt wird im localStorage dieses Geräts gespeichert.
   Lehrkraft-Ansicht (alle Stufen frei): über „Lehrkraft-Zugang“ mit Kennwort freischalten.
   Im Kennwort-Vergleich wird nur der SHA-256-Hash gespeichert, nicht das Kennwort selbst.
   ========================================================= */

/* ---------- Hilfsfunktionen ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function fmt(x, d) { if (x === null || x === undefined || !isFinite(x)) return '–'; d = (d === undefined ? 2 : d); return x.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function fmtN(x, max) { if (x === null || x === undefined || !isFinite(x)) return '–'; return x.toLocaleString('de-DE', { maximumFractionDigits: (max === undefined ? 2 : max) }); }
const eur = x => fmt(x, 2) + ' €';
const eur0 = x => fmt(x, 0) + ' €';
const minus = x => (Math.round(x) === 0 ? '0 €' : '−' + eur0(x));
const proz = (x, d) => fmtN(x, d === undefined ? 2 : d) + ' %';
const stk = x => fmtN(x, 2) + ' St.';
const tage = x => fmtN(x, 2) + ' Tage';
function parseZahl(s) {
  if (s === null || s === undefined) return null;
  s = String(s).trim().replace(/€|%|Stück|St\.?|Tage|Tag|mal|\s/gi, '').replace(/−/g, '-');
  if (!s) return null;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const v = Number(s);
  return isFinite(v) ? v : null;
}
function istNah(v, e, tol) {
  if (v === null || v === undefined || e === null || e === undefined || !isFinite(v) || !isFinite(e)) return false;
  tol = (tol === undefined ? 0.01 : tol);
  if (Math.abs(e) < 1e-9) return Math.abs(v) < 0.01;
  return Math.abs(v - e) <= Math.abs(e) * tol + 1e-9;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const rund = (x, st) => Math.round(x / st) * st;
function mischen(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function gleicheMenge(a, b) { if (a.length !== b.length) return false; const x = a.slice().sort().join('|'), y = b.slice().sort().join('|'); return x === y; }
function el(html) { const t = document.createElement('div'); t.innerHTML = html.trim(); return t.firstElementChild; }
function bruch(z, n) { return `<span class="bruch"><span class="z">${z}</span><span class="n">${n}</span></span>`; }
function tabelle(kopf, zeilen, rechtsAb) {
  rechtsAb = rechtsAb === undefined ? 1 : rechtsAb;
  return `<div class="tabwrap"><table class="tab">${kopf ? `<thead><tr>${kopf.map((k, i) => `<th class="${i >= rechtsAb ? 'z' : ''}">${k}</th>`).join('')}</tr></thead>` : ''}<tbody>${zeilen.map(r => `<tr>${r.map((c, i) => `<td class="${i >= rechtsAb ? 'z' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function weg(schritte) {
  return `<div class="weg">${schritte.map(s => `<div class="schritt"><div class="t">${s[0]}</div><div class="l">${s[1]}</div>${s[2] ? `<div class="l">= ${s[2]}</div>` : ''}<div class="l">= <strong>${s[3]}</strong></div>${s[4] ? `<div class="klein">${s[4]}</div>` : ''}</div>`).join('')}</div>`;
}
function berechne(dlb, we, jz) { const uh = we / dlb, dld = 360 / uh, lzz = jz * dld / 360, lz = dlb * lzz / 100; return { dlb, we, jz, uh, dld, lzz, lz }; }
const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const FIRMEN = ['Holzmann Bürobedarf GmbH', 'Brenner Sportartikel KG', 'Kaiser Elektrogroßhandel GmbH', 'Fischer Werkzeughandel e. K.', 'Lindner Gartenbedarf OHG', 'Sauter Haustechnik GmbH', 'ESS GmbH'];

/* ---------- Fortschritt ---------- */
const KEY = 'lagerkennzahlen-lernpfad-v1';
const PWD_HASH = '5e484a66e24c206a06328a66ccc831f27ea3045576eec35c12070acf1bc3ac99';
const LK_KEY = 'lagerkennzahlen-lehrkraft';
let LEHRKRAFT = localStorage.getItem(LK_KEY) === PWD_HASH;
function leer() { return { s1: { bau: {}, quiz: 0, passed: false }, s2: { solved: {}, passed: false }, s3: { worte: 0, prog: 0, passed: false }, s4: { cards: {}, passed: false }, s5: { played: false, sterne: 0, passed: false }, s6: { best: 0, gesamt: 0, passed: false }, name: '' }; }
function laden() { try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); const l = leer(); Object.keys(l).forEach(k => { if (o[k] !== undefined) l[k] = (typeof l[k] === 'object' ? Object.assign(l[k], o[k]) : o[k]); }); return l; } } catch (e) { } return leer(); }
let P = laden();
function speichern() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { } }
function frei(n) { if (LEHRKRAFT || n === 1) return true; return !!P['s' + (n - 1)].passed; }
function rechnerFrei() { return LEHRKRAFT || P.s2.passed; }

const STUFEN = [
  { n: 1, titel: 'Formeln sicher', kurz: 'Lernkarten, Formel-Baukasten und Begriffsquiz', ziel: 'Alle 7 Formeln im Baukasten richtig bauen und im Begriffsquiz mindestens 10 von 12 Fragen richtig beantworten.' },
  { n: 2, titel: 'Rechnen', kurz: 'Zufallsaufgaben im Prüfmodus: Jahres-, Quartals- und Monatsinventur (Lagerkarte)', ziel: 'Je eine Aufgabe jeder Art vollständig richtig lösen, ohne vorher den Rechenweg anzuzeigen.' },
  { n: 3, titel: 'Interpretieren', kurz: 'Zahlen in Worte fassen und Wirkungen vorhersagen („Was passiert, wenn …?“)', ziel: 'Mindestens 4 von 5 Deutungen richtig und mindestens 7 von 10 Prognosen im ersten Versuch richtig.' },
  { n: 4, titel: 'Branchenvergleich', kurz: 'Vier Unternehmen beurteilen – Ursachen erkennen, Maßnahmen begründen', ziel: 'Alle vier Fallkarten vollständig bearbeiten.' },
  { n: 5, titel: 'Lager optimieren', kurz: 'Planspiel: ein Jahr als Lagermanager der ESS GmbH', ziel: 'Ein komplettes Jahr spielen und die eigene Strategie schriftlich beurteilen.' },
  { n: 6, titel: 'Abi-Aufgabe (Endboss)', kurz: 'Komplette Abituraufgabe mit Bewertungseinheiten (BE)', ziel: 'Bei den Rechenteilen mindestens 10 von 14 BE im ersten Prüfdurchgang.' }
];
function fortschritt(n) {
  const s = P['s' + n];
  if (s.passed) return 1;
  switch (n) {
    case 1: return (Object.keys(s.bau).length / 7) * 0.5 + Math.min(s.quiz / 10, 1) * 0.5;
    case 2: return Object.keys(s.solved).length / 3;
    case 3: return (Math.min(s.worte / 4, 1) + Math.min(s.prog / 7, 1)) / 2;
    case 4: return Object.keys(s.cards).length / 4;
    case 5: return s.played ? 0.6 : 0;
    case 6: return Math.min(s.best / 10, 1) * 0.9;
  }
  return 0;
}
function bestanden(n) {
  if (P['s' + n].passed) return;
  P['s' + n].passed = true; speichern();
  const b = el(`<div class="hinweis gut banner"><strong>Stufe ${n} bestanden!</strong> ${n < 6 ? `<a class="btn klein" href="#s${n + 1}">Weiter zu Stufe ${n + 1}</a>` : `<a class="btn klein" href="#nachweis">Abschlussnachweis anzeigen</a>`}</div>`);
  const m = $('#main'); m.insertBefore(b, m.firstChild); window.scrollTo({ top: 0, behavior: 'smooth' });
  navZeichnen();
}

/* ---------- Bausteine ---------- */
let UID = 0;
function feldGruppe(box, felder) {
  const id = ++UID;
  box.innerHTML = `<div class="felder">${felder.map(f => `
    <div class="feld" data-k="${f.key}">
      <label for="f${id}_${f.key}">${f.label}</label>

  box.innerHTML = `<div class="hinweis vert"><span class="badge vert">Vertiefung · freiwillig</span>
    <p><strong>Beobachtung:</strong> Das gebundene Kapital sinkt in Teilaufgabe 3b auf ${proz(qK * 100, 1)} des Ausgangswerts – die Lagerzinsen aber auf ${proz(qZ * 100, 1)}. Warum sinken die Lagerzinsen so viel stärker?</p><div class="vmc"></div></div>`;
  einzelwahl($('.vmc', box), { o: [
    { t: 'Nach der Formel „Ø Lagerbestand × Lagerzinssatz“ sinken zwei Faktoren gleichzeitig: der Bestand und – über die kürzere Lagerdauer – der Lagerzinssatz.', ok: true, e: `Genau: ${proz(qK * 100, 1)} × ${proz(qK * 100, 1)} ≈ ${proz(qK * qK * 100, 1)}. Der Effekt wirkt doppelt (quadratisch).` },
    { t: 'Weil der Jahreszinssatz gesunken ist.', ok: false, e: 'Der Jahreszinssatz ist unverändert geblieben.' },
    { t: 'Das ist ein Rundungsfehler.', ok: false, e: 'Der Unterschied ist viel zu groß für Rundungsdifferenzen.' }
  ] }, () => {
    box.insertAdjacentHTML('beforeend', `<div class="hinweis vert"><p><strong>Was steckt dahinter?</strong> Die Formel „Ø Lagerbestand × Lagerzinssatz“ berechnet die Zinsen für <em>eine</em> durchschnittliche Lagerdauer. Das durchschnittlich gebundene Kapital liegt aber das <em>ganze Jahr</em> im Lager. Betriebswirtschaftlich genauer sind die jährlichen Zinskosten:</p>
      <div class="formel">Ø gebundenes Kapital × Jahreszinssatz = Wareneinsatz × Lagerzinssatz</div>
      ${tabelle(['', 'vorher', 'nachher', 'Einsparung'], [['Jährliche Zinskosten auf das gebundene Kapital', eur(jahrAlt), eur(jahrNeu), eur(jahrAlt - jahrNeu)], ['Lagerzinsen nach der Unterrichtsformel', eur(L.lz), eur(E.lzB), eur(E.spB)]])}
      <p>In der Jahresbetrachtung sinken die Zinskosten genau im Verhältnis des gebundenen Kapitals. Prüfe selbst: Lagerzinsen nach der Unterrichtsformel × Umschlagshäufigkeit = Jahreszinskosten (${eur(L.lz)} × ${fmtN(L.uh, 4)} ≈ ${eur(L.lz * L.uh)}).</p>
      <p><strong>Für Klausur und Abitur:</strong> Rechne nach der im Unterricht eingeführten Formel. Die Jahresbetrachtung hilft dir zu verstehen, warum Kapitalbindung teuer ist. Frag im Zweifel deine Lehrkraft, ob du sie in einer Beurteilung ergänzend anführen sollst.</p></div>`);
  });
}

/* =========================================================
   FREIER RECHNER
   ========================================================= */
function viewRechner(m) {
  m.innerHTML = `<a class="zurueck" href="#home">← Lernpfad</a>
  <div class="karte"><h2>Werkzeug: Lagerkennzahlen-Rechner</h2><p>Zum Kontrollieren eigener Rechnungen. Erst selbst rechnen, dann vergleichen!</p></div>
  <div class="raster2">
    <div class="karte">
      <label class="zeile">Inventurart<select class="std" id="r_art"><option value="jahr">Jahresinventur</option><option value="quartal">Quartalsinventur</option><option value="monat">Monatsinventur</option></select></label>
      <div id="r_best"></div>
      <label class="zeile">Wareneinsatz zu Einstandspreisen (€)<input class="std" id="r_we" inputmode="decimal"></label>
      <label class="zeile">Zinsangabe<select class="std" id="r_zart"><option value="jz">Jahreszinssatz gegeben</option><option value="lzz">Lagerzinssatz direkt gegeben</option></select></label>
      <label class="zeile"><span id="r_zlab">Jahreszinssatz (%)</span><input class="std" id="r_z" inputmode="decimal"></label>
      <label class="zeile">Sonstige Lagerhaltungskosten (€, optional)<input class="std" id="r_lhk" inputmode="decimal"></label>
      <label class="zeile">Umschlagshäufigkeit der Branche (optional)<input class="std" id="r_uhb" inputmode="decimal"></label>
      <div class="aktionen"><button class="btn sek" id="r_bsp">Beispiel: Arbeitsblatt ESS GmbH</button><button class="btn sek" id="r_leer">Leeren</button></div>
    </div>
    <div class="karte" id="r_aus"><p class="klein">Ergebnisse erscheinen hier, sobald die nötigen Werte eingetragen sind.</p></div>
  </div>`;
  const bestFelder = () => {
    const a = $('#r_art').value, n = a === 'jahr' ? ['Anfangsbestand 01.01.', 'Endbestand 31.12.'] : a === 'quartal' ? ['Anfangsbestand 01.01.', 'Bestand 31.03.', 'Bestand 30.06.', 'Bestand 30.09.', 'Bestand 31.12.'] : ['Anfangsbestand 01.01.'].concat(MONATE.map(x => 'Ende ' + x));
    $('#r_best').innerHTML = `<div class="felder" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${n.map((t, i) => `<label class="zeile">${t} (€)<input class="std rb" data-i="${i}" inputmode="decimal"></label>`).join('')}</div>`;
    $$('.rb').forEach(i => i.oninput = rechne);
  };
  function rechne() {
    const a = $('#r_art').value, best = $$('.rb').map(i => parseZahl(i.value));
    const we = parseZahl($('#r_we').value), z = parseZahl($('#r_z').value), zart = $('#r_zart').value, lhk = parseZahl($('#r_lhk').value), uhb = parseZahl($('#r_uhb').value);
    const aus = $('#r_aus');
    if (best.some(x => x === null) || we === null || z === null) { aus.innerHTML = '<p class="klein">Bitte alle Bestände, den Wareneinsatz und die Zinsangabe eintragen.</p>'; return; }
    const div = a === 'jahr' ? 2 : a === 'quartal' ? 5 : 13, summe = best.reduce((x, y) => x + y, 0), dlb = summe / div;
    if (dlb <= 0 || we <= 0) { aus.innerHTML = '<p class="klein">Bestand und Wareneinsatz müssen größer als 0 sein.</p>'; return; }
    const uh = we / dlb, dld = 360 / uh, lzz = zart === 'jz' ? z * dld / 360 : z, jz = zart === 'jz' ? z : z * 360 / dld, lz = dlb * lzz / 100;
    let html = `<h3>Ergebnisse</h3>${tabelle(['Kennzahl', 'Wert'], [['Ø Lagerbestand', eur(dlb)], ['Umschlagshäufigkeit', fmtN(uh) + '-mal'], ['Ø Lagerdauer', tage(dld)], ['Lagerzinssatz', proz(lzz, 4)], ['Lagerzinsen', eur(lz)]].concat(lhk !== null ? [['Kosten der Lagerhaltung', eur(lz + lhk)]] : []))}
      <details class="wegbox" open><summary>Rechenweg</summary>${weg([
        ['Ø Lagerbestand', a === 'jahr' ? '(AB + EB) / 2' : a === 'quartal' ? '(AB + 4 Quartalsendbestände) / 5' : '(AB + 12 Monatsendbestände) / 13', `${eur(summe)} / ${div}`, eur(dlb)],
        ['Umschlagshäufigkeit', 'Wareneinsatz / Ø Lagerbestand', `${eur(we)} / ${eur(dlb)}`, fmtN(uh, 4)],
        ['Ø Lagerdauer', '360 / UH', `360 / ${fmtN(uh, 4)}`, tage(dld)],
        zart === 'jz' ? ['Lagerzinssatz', 'Jahreszinssatz × DLD / 360', `${proz(z)} × ${fmtN(dld, 4)} / 360`, proz(lzz, 4)] : ['Lagerzinssatz', 'vorgegeben', '', proz(lzz, 4), `Entspricht einem Jahreszinssatz von ${proz(jz)} (LZZ × 360 / DLD).`],
        ['Lagerzinsen', 'Ø Lagerbestand × LZZ / 100', `${eur(dlb)} × ${fmtN(lzz, 4)} / 100`, eur(lz)]
      ].concat(lhk !== null ? [['Kosten der Lagerhaltung', 'Lagerzinsen + Lagerhaltungskosten', `${eur(lz)} + ${eur(lhk)}`, eur(lz + lhk)]] : []))}</details>`;
    if (uhb !== null && uhb > 0) {
      const dlbB = we / uhb, dldB = 360 / uhb, lzzB = jz * dldB / 360, lzB = dlbB * lzzB / 100;
      html += `<h3>Branchenvergleich</h3>${tabelle(['', 'Unternehmen', 'Branche (bei gleichem Wareneinsatz)'], [['Umschlagshäufigkeit', fmtN(uh), fmtN(uhb)], ['Ø Lagerdauer', tage(dld), tage(dldB)], ['Ø Lagerbestand', eur(dlb), eur(dlbB)], ['Lagerzinssatz', proz(lzz, 3), proz(lzzB, 3)], ['Lagerzinsen', eur(lz), eur(lzB)]])}
        <div class="hinweis info">${dlb > dlbB ? `Bei gleichem Wareneinsatz käme der Branchendurchschnitt mit ${eur0(dlbB)} Ø Lagerbestand aus. Im Unternehmen sind <strong>${eur0(dlb - dlbB)} mehr Kapital</strong> gebunden (Faktor ${fmtN(dlb / dlbB)}). Mögliches Einsparpotenzial bei den Lagerzinsen: ${eur0(lz - lzB)}.` : `Das Unternehmen bindet ${eur0(dlbB - dlb)} weniger Kapital als der Branchendurchschnitt.`}
        <br><span class="klein">Vorsicht: Ein Branchenvergleich ist nur aussagekräftig, wenn Sortiment, Geschäftsmodell und Lieferbereitschaft vergleichbar sind.</span></div>`;
    }
    aus.innerHTML = html;
  }
  $('#r_art').onchange = () => { bestFelder(); rechne(); };
  $('#r_zart').onchange = () => { $('#r_zlab').textContent = $('#r_zart').value === 'jz' ? 'Jahreszinssatz (%)' : 'Lagerzinssatz (%)'; rechne(); };
  ['#r_we', '#r_z', '#r_lhk', '#r_uhb'].forEach(s => $(s).oninput = rechne);
  $('#r_bsp').onclick = () => { $('#r_art').value = 'jahr'; bestFelder(); const b = $$('.rb'); b[0].value = '550.000'; b[1].value = '700.000'; $('#r_we').value = '3.000.000'; $('#r_zart').value = 'lzz'; $('#r_zlab').textContent = 'Lagerzinssatz (%)'; $('#r_z').value = '5'; $('#r_uhb').value = '18'; $('#r_lhk').value = ''; rechne(); };
  $('#r_leer').onclick = () => { viewRechner(m); };
  bestFelder();
}

/* =========================================================

   ========================================================= */
const VIEWS = { home: viewHome, s1: viewS1, s2: viewS2, s3: viewS3, s4: viewS4, s5: viewS5, s6: viewS6, rechner: viewRechner, nachweis: viewNachweis };
function navZeichnen() {
  const h = (location.hash || '#home').slice(1);
  $('#nav').innerHTML = `<a href="#home" class="${h === 'home' ? 'aktiv' : ''}">Lernpfad</a><a href="#rechner" class="${h === 'rechner' ? 'aktiv' : ''}">${rechnerFrei() ? '' : '🔒 '}Rechner</a>`;
}
function route() {
  const h = (location.hash || '#home').slice(1);
  const m = $('#main');
  navZeichnen(); lehrkraftLeiste();
  const n = /^s(\d)$/.test(h) ? +h[1] : 0;
  if (n && !frei(n)) { m.innerHTML = `<div class="karte"><h2>🔒 Stufe ${n} ist noch gesperrt</h2><p>Bestehe zuerst Stufe ${n - 1}.</p><a class="btn" href="#s${n - 1}">Zu Stufe ${n - 1}</a></div>`; return; }
  if (h === 'rechner' && !rechnerFrei()) { m.innerHTML = '<div class="karte"><h2>🔒 Der Rechner ist noch gesperrt</h2><p>Er wird freigeschaltet, sobald du Stufe 2 (Rechnen) bestanden hast. Erst selbst rechnen können, dann rechnen lassen.</p><a class="btn" href="#home">Zum Lernpfad</a></div>'; return; }
  (VIEWS[h] || viewHome)(m);
  window.scrollTo(0, 0);
}
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function lehrkraftLeiste() {
  $('#lehrkraftleiste').innerHTML = LEHRKRAFT ? '<div class="lehrkraft"><div class="in"><strong>Lehrkraft-Ansicht:</strong> Alle Stufen und der Rechner sind frei. <button class="linkbtn" id="lk_out">Abmelden</button></div></div>' : '';
  const o = $('#lk_out'); if (o) o.onclick = () => { localStorage.removeItem(LK_KEY); LEHRKRAFT = false; route(); };
}
function lehrkraftZugang() {
  const box = $('#lk_box'); if (!box) return;
  box.innerHTML = `<div class="karte" style="max-width:420px;margin:0 auto"><label class="zeile">Kennwort<input class="std" id="lk_pw" type="password" autocomplete="off"></label>
    <div class="aktionen"><button class="btn" id="lk_ok">Freischalten</button><button class="btn sek" id="lk_no">Abbrechen</button></div><div class="klein" id="lk_msg"></div></div>`;
  $('#lk_no').onclick = () => { box.innerHTML = ''; };
  const pruefe = async () => {
    try {
      const h = await sha256Hex($('#lk_pw').value);
      if (h === PWD_HASH) { localStorage.setItem(LK_KEY, h); LEHRKRAFT = true; route(); }
      else $('#lk_msg').textContent = 'Das Kennwort stimmt nicht.';
    } catch (e) { $('#lk_msg').textContent = 'Die Prüfung ist in diesem Browser nicht verfügbar (HTTPS nötig).'; }
  };
  $('#lk_ok').onclick = pruefe;
  $('#lk_pw').addEventListener('keydown', e => { if (e.key === 'Enter') pruefe(); });
  $('#lk_pw').focus();
}
window.addEventListener('hashchange', route);
route();
</script>
<script>
/* Höhenmeldung an die Lehrseite (eingebettet per iframe) */
(function(){
  if (window.parent === window) return;
  var letzte = 0;
  function melde(){
    window.requestAnimationFrame(function(){
      var h = document.documentElement.scrollHeight;
      if (Math.abs(h - letzte) > 4){ letzte = h; try { window.parent.postMessage({ typ: "rechner-hoehe", hoehe: h }, "*"); } catch (e) {} }
    });
  }
  if (window.ResizeObserver) new ResizeObserver(melde).observe(document.body);
  window.addEventListener("load", melde);
  window.addEventListener("hashchange", melde);
})();
</script>
