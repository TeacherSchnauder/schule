<script>
const SAMPLE = `= Krankenversicherung: 14,6 % + durchschnittlicher Zusatzbeitrag 2,9 %, je zur Hälfte AG und AN (AN zusammen 8,75 %)
= Pflegeversicherung: 3,6 %, je 1,8 % AG und AN; Kinderlose ab 23 Jahren zahlen 0,6 % Zuschlag allein (AN dann 2,4 %)
= Rentenversicherung: 18,6 %, je 9,3 % AG und AN
= Arbeitslosenversicherung: 2,6 %, je 1,3 % AG und AN
= Beitragsbemessungsgrenze KV/PV: 5.812,50 € im Monat
= Beitragsbemessungsgrenze RV/AV: 8.450,00 € im Monat
= Kirchensteuer Baden-Württemberg: 8 % der Lohnsteuer
= In diesem Spiel: höchstens 1 Kind; Unfallversicherung und Umlagen werden nicht berechnet

# Sektor 1 · Sicherungsnebel | 35
@ Zweige, Träger und Fälle | Lerncheckliste 1
?2 Herr Yilmaz ist Tarifbeschäftigter im Bürgeramt. Auf dem direkten Weg zur Arbeit stürzt er mit dem Fahrrad und bricht sich den Arm. Welcher Träger ist für die Behandlung zuständig?
+ Unfallkasse (gesetzliche UV)
- Seine Krankenkasse ~ Wegeunfall nicht als Fall der Unfallversicherung erkannt
- Deutsche Rentenversicherung ~ Träger der Sozialversicherung verwechselt
! Der direkte Weg zur Arbeit ist in der gesetzlichen Unfallversicherung versichert (Wegeunfall, § 8 Abs. 2 SGB VII). Träger für Beschäftigte der Kommunen ist die Unfallkasse.
?1 In einem Amt arbeiten die Beamtin Frau Kern und der Tarifbeschäftigte Herr Lutz. Wer zahlt Beiträge zur gesetzlichen Renten- und Arbeitslosenversicherung?
+ Nur Herr Lutz
- Beide ~ Beamte wie Tarifbeschäftigte behandelt
- Nur Frau Kern ~ Beamte und Tarifbeschäftigte vertauscht
! Beamte sind in der Renten- und Arbeitslosenversicherung versicherungsfrei, sie werden vom Dienstherrn versorgt. Tarifbeschäftigte sind pflichtversichert.

@ Finanzierung und Ausnahmen | Lerncheckliste 1
?2 Welche Aussage zur Finanzierung der Sozialversicherung ist richtig?
+ Die UV zahlt nur der AG, den Kinderlosenzuschlag nur der AN.
- Die UV und den Kinderlosenzuschlag zahlt nur der AG. ~ Kinderlosenzuschlag dem Arbeitgeber zugeordnet
- Die UV zahlt nur der AN, den Kinderlosenzuschlag nur der AG. ~ Ausnahmen der paritätischen Finanzierung vertauscht
- Beide werden zwischen AG und AN je zur Hälfte geteilt. ~ Alle Beiträge für paritätisch gehalten
! Das sind die beiden Ausnahmen von der paritätischen Finanzierung. Die UV trägt der Arbeitgeber allein, den Kinderlosenzuschlag zur Pflegeversicherung der Arbeitnehmer allein.
?2 Warum finanziert der Arbeitgeber die gesetzliche Unfallversicherung allein?
+ Sie ersetzt seine Haftung für Arbeitsunfälle
- Arbeitnehmer erhalten aus ihr keine Leistungen ~ Leistungen der Unfallversicherung verkannt
- Der Staat erstattet ihm die Beiträge ~ Unfallversicherung für steuerfinanziert gehalten
! Die UV löst die Haftung des Unternehmers für Arbeitsunfälle ab (§ 104 SGB VII). Dafür trägt er die Beiträge allein.
?2 Welche Leistung wird aus Steuern bezahlt und nicht aus Beiträgen zur Arbeitslosenversicherung?
+ Grundsicherung für Arbeitsuchende
- Arbeitslosengeld der Arbeitsagentur ~ Arbeitslosengeld und Grundsicherung verwechselt
- Kurzarbeitergeld der Arbeitsagentur ~ Arbeitslosengeld und Grundsicherung verwechselt
! Die Grundsicherung für Arbeitsuchende ist steuerfinanziert und keine Versicherungsleistung. Arbeitslosengeld und Kurzarbeitergeld zahlt die Bundesagentur für Arbeit aus Beiträgen.

@ Rente: Umlageverfahren und Demografie | Lerncheckliste 2
?1 Woher kommt im Umlageverfahren das Geld für die Renten, die heute ausgezahlt werden?
+ Von heutigen Beitragszahlern und dem Bund
- Aus den früher angesparten Beiträgen ~ Umlageverfahren mit Kapitaldeckung verwechselt
- Aus Erträgen von Aktienfonds ~ Umlageverfahren mit Kapitaldeckung verwechselt
! Die Beiträge von heute bezahlen die Renten von heute, dazu kommt der Bundeszuschuss. Angespart wird im Umlageverfahren nicht.
?2 Die Lebenserwartung steigt, die Geburtenrate bleibt niedrig. Beitragssatz, Rentenniveau und Renteneintrittsalter sollen trotzdem gleich bleiben. Was folgt daraus?
+ Der Bundeszuschuss muss steigen
- Es ändert sich nichts ~ Wirkung des demografischen Wandels unterschätzt
- Rücklagen der Rentner decken die Lücke ~ Umlageverfahren mit Kapitaldeckung verwechselt
! Auf jeden Beitragszahler kommen mehr Rentner (Altenquotient steigt). Sind die anderen drei Stellschrauben fest, bleibt nur ein höherer Bundeszuschuss (vereinfacht: auch Beschäftigung, Zuwanderung und Löhne wirken).
?2 Angenommen, das Rentenniveau sinkt von 48 % auf 46 %. Was bedeutet das?
+ Die Standardrente wächst langsamer als Löhne
- Jede laufende Rente wird um 2 % gekürzt ~ Rentenniveau mit der eigenen Rente verwechselt
- Jeder erhält 46 % seines letzten Gehalts ~ Rentenniveau mit der eigenen Rente verwechselt
! Das Rentenniveau vergleicht eine Standardrente (45 Beitragsjahre, Durchschnittsverdienst) mit dem Durchschnittslohn. Es ist ein Verhältniswert, keine Aussage über die eigene Rente.

@ Schichtenmodell und Förderung | Lerncheckliste 3
?1 Zu welcher Schicht der Altersvorsorge gehört die Basisrente („Rürup-Rente“)?
+ Schicht 1
- Schicht 2 ~ Basisrente mit Riester-Rente verwechselt
- Schicht 3 ~ Private Verträge automatisch der 3. Schicht zugeordnet
! Die Basisrente gehört wie die gesetzliche Rente zur Basisversorgung (Schicht 1). Riester-Rente und betriebliche Altersversorgung bilden Schicht 2.
?2 Frau Brandt lässt monatlich 100 € ihres Bruttogehalts in eine Betriebsrente umwandeln (innerhalb der Höchstbeträge). Was gilt?
+ Ihr Netto sinkt um weniger als 100 €.
- Ihr Netto sinkt um genau 100 €. ~ Förderung der Entgeltumwandlung übersehen
- Ihr Netto steigt durch die Förderung. ~ Förderung der Entgeltumwandlung überschätzt
- Die Betriebsrente ist später steuerfrei. ~ Nachgelagerte Besteuerung verkannt
! Der umgewandelte Betrag ist steuerfrei und bis 4 % der BBG RV beitragsfrei, deshalb sinkt das Netto um weniger als 100 €. Dafür wird die Betriebsrente später versteuert (nachgelagerte Besteuerung).

# Sektor 2 · Lohngürtel | 50
@ Abzüge und Rechenweg | Lerncheckliste 4
?2 Herr Kaya verdient 4.000 € brutto und hat ein Kind. Wie hoch ist sein Arbeitnehmeranteil zur Sozialversicherung insgesamt (Werte laut Datenblatt)?
+ 846,00 €
- 870,00 € ~ Kinderlosenzuschlag trotz Kind berechnet
- 788,00 € ~ Zusatzbeitrag der Krankenversicherung vergessen
- 1.692,00 € ~ Arbeitgeber- und Arbeitnehmeranteil zusammengerechnet
! KV 8,75 % + PV 1,8 % + RV 9,3 % + AV 1,3 % = 21,15 %. 4.000 € · 21,15 % = 846,00 €.
?2 Herr Kaya: Brutto 4.000 €, Sozialversicherung (AN) 846,00 €, Lohnsteuer 520,00 €, Kirchensteuer 41,60 €, kein Solidaritätszuschlag. Wie hoch ist sein Nettoentgelt?
+ 2.592,40 €
- 2.634,00 € ~ Abzüge unvollständig
- 3.154,00 € ~ Abzüge unvollständig
- 1.746,40 € ~ Arbeitgeberanteil zusätzlich abgezogen
! Netto = Brutto − Steuern − AN-Anteil zur Sozialversicherung: 4.000 € − 520,00 € − 41,60 € − 846,00 € = 2.592,40 €.

@ Kirchensteuer | Lerncheckliste 4
?2 Frau Weber (Baden-Württemberg, keine Kinder, Kirchenmitglied) verdient 4.200 € brutto und zahlt 600 € Lohnsteuer. Wie hoch ist ihre Kirchensteuer?
+ 48,00 €
- 336,00 € ~ Kirchensteuer vom Bruttoentgelt berechnet
- 54,00 € ~ Kirchensteuersatz anderer Bundesländer (9 %) verwendet
! In Baden-Württemberg beträgt die Kirchensteuer 8 % der Lohnsteuer: 600 € · 8 % = 48,00 €. Grundlage ist die Lohnsteuer, nicht das Brutto.
?2 Frau Weber erhält eine Gehaltserhöhung. Ihre Lohnsteuer steigt dadurch um 50 €. Was passiert mit ihrer Kirchensteuer?
+ Sie steigt um 4,00 €.
- Sie steigt um 8 % der Gehaltserhöhung. ~ Kirchensteuer vom Bruttoentgelt berechnet
- Sie bleibt gleich. ~ Zusammenhang von Lohnsteuer und Kirchensteuer verkannt
! Die Kirchensteuer hängt an der Lohnsteuer: 50 € · 8 % = 4,00 € mehr.

@ Beitragsbemessungsgrenzen | Lerncheckliste 4
?2 Frau Dorn verdient 6.000 € brutto. Von welchem Betrag werden ihre Sozialversicherungsbeiträge berechnet?
+ KV/PV von 5.812,50 €, RV/AV von 6.000 €
- Alle Beiträge von 6.000 € ~ Beitragsbemessungsgrenze nicht beachtet
- Alle Beiträge von 5.812,50 € ~ Nur eine Beitragsbemessungsgrenze für alle Zweige angenommen
- KV/PV von 6.000 €, RV/AV von 5.812,50 € ~ Grenzen von KV/PV und RV/AV vertauscht
! 6.000 € liegen über der Grenze für KV/PV (5.812,50 €), aber unter der Grenze für RV/AV (8.450 €). Oberhalb einer Grenze steigt der Beitrag nicht weiter.
?2 Frau Dorn verdient 6.000 € brutto und hat ein Kind. Wie hoch ist ihr Arbeitnehmeranteil zur Krankenversicherung (8,75 %)?
+ 508,59 €
- 525,00 € ~ Beitragsbemessungsgrenze nicht beachtet
- 424,31 € ~ Zusatzbeitrag der Krankenversicherung vergessen
- 1.017,19 € ~ Arbeitgeber- und Arbeitnehmeranteil zusammengerechnet
! 5.812,50 € · 8,75 % = 508,59 €. Über der Grenze für KV/PV zählt nur das Entgelt bis zur Grenze.
?2 Herr Vogt verdient 9.000 € brutto. Wie hoch ist sein Arbeitnehmeranteil zur Rentenversicherung?
+ 785,85 €
- 837,00 € ~ Beitragsbemessungsgrenze nicht beachtet
- 540,56 € ~ Grenze der KV/PV statt der RV/AV verwendet
- 1.571,70 € ~ Arbeitgeber- und Arbeitnehmeranteil zusammengerechnet
! Für RV und AV gilt die höhere Grenze von 8.450 €: 8.450 € · 9,3 % = 785,85 €.
?3 Welche Wirkung hat die Beitragsbemessungsgrenze für Beschäftigte mit sehr hohem Gehalt?
+ Ihr Beitrag in % des Bruttos sinkt
- Sie zahlen prozentual mehr als andere ~ Wirkung der Beitragsbemessungsgrenze umgekehrt
- Sie zahlen keine Beiträge mehr ~ Beitragsbemessungsgrenze mit Versicherungspflichtgrenze verwechselt
! Über der Grenze bleibt der Beitrag gleich, obwohl das Brutto steigt, deshalb sinkt der Anteil am Brutto. Kritiker sehen darin eine Entlastung hoher Einkommen, Befürworter verweisen auf begrenzte Leistungen, z. B. bei der Rente.

@ Arbeitgeberanteil und Personalkosten | Lerncheckliste 4
?2 Herr Kaya verdient 4.000 € brutto und hat ein Kind. Wie hoch sind die Personalkosten seines Arbeitgebers (ohne UV und Umlagen)?
+ 4.846,00 €
- 3.154,00 € ~ Arbeitnehmeranteil abgezogen statt Arbeitgeberanteil addiert
- 5.692,00 € ~ Arbeitgeber- und Arbeitnehmeranteil zusammengerechnet

- Keine: Kleingewerbe bleibt Kleingewerbe ~ Freiwillige Eintragung (§ 2 HGB) nicht gekannt

/* ===== Fragen ===== */
function ask(q,mode){
  G.state=mode==='boss'?'bossQ':'question';
  G.enemies.forEach(e=>boom(e.x,e.y,8,['#ffe14a','#ff9f1c']));G.enemies=[];G.bullets.forEach(b=>boom(b.x,b.y,3,['#ff3fb4']));G.bullets=[];G.shots=[];
  const wrong=shuffle(q.wrong.slice()).slice(0,3);
  const ans=shuffle([{t:q.right,ok:true,mis:''},...wrong.map(w=>({t:w.t,ok:false,mis:w.mis}))]);
  const words=(q.text+' '+ans.map(a=>a.t).join(' ')).split(/\s+/).length;
  let T=mode==='boss'?Math.max(q.sec.base,Math.round(30+words)):Math.max(q.sec.base,Math.round(8+words*.8));
  if(OPT.calm)T=Math.round(T*1.5);
  const gate=mode==='sector'&&ans.length<=3&&ans.every(a=>a.t.length<=34);
  G.cur={q,mode,ans,T,left:mode==='dock'?Infinity:T,gate,sel:1,done:false,joker:false};
  const sec=SET.sectors[G.sector];
  $('#qtag').textContent=mode==='boss'?'ENDBOSS · '+q.concept:mode==='dock'?'REPARATURDOCK · ohne Zeitdruck':'FRAGE '+(G.qi+1)+'/'+sec.qs.length+' · '+q.concept;
  $('#qbox').classList.toggle('boss',mode==='boss');
  $('#qtext').textContent=q.text;
  $('#qbar').classList.toggle('hidden',mode==='dock');$('#qtime').textContent=mode==='dock'?'∞':T+' s';
  $('#qtools').classList.toggle('hidden',mode!=='boss');
  if(mode==='boss'){$('#bJoker').disabled=G.jokers<1;$('#bStretch').disabled=G.stretch<1;$('#bJoker').textContent='50:50-Joker ('+G.jokers+')';$('#bStretch').textContent='+30 s Zeitdehner ('+G.stretch+')'}
  const box=$('#answers');box.className=gate?'gates':'cockpit';
  box.innerHTML=ans.map((a,i)=>`<button class="ans${gate&&i===1?' sel':''}" data-i="${i}"><b>${i+1}</b>${esc(a.t)}</button>`).join('');
  box.querySelectorAll('.ans').forEach(b=>b.onclick=e=>{e.stopPropagation();choose(+b.dataset.i)});
  ['#qbox','#answers'].forEach(s=>$(s).classList.remove('hidden'));$('#fb').classList.add('hidden');$('#qbox').scrollTop=0;
  if(gate){G.ship.tx=laneX(1);G.ship.ty=H-60}
  duck(true);sfx('time');hud();
}
const laneX=i=>W*(i*2+1)/6;
function setSel(i){if(!G.cur||!G.cur.gate||G.cur.done)return;G.cur.sel=clamp(i,0,G.cur.ans.length-1);
  document.querySelectorAll('#answers .ans').forEach((b,j)=>b.classList.toggle('sel',j===G.cur.sel));G.ship.tx=laneX(G.cur.sel)}
function record(a,timeout){const c=G.cur;G.attempts.push({id:c.q.id,mode:c.mode,ok:!!(a&&a.ok),to:!!timeout,jk:c.joker,mis:a&&!a.ok?a.mis:'',ch:a?a.t:'',s:c.left===Infinity?0:Math.round(c.T-c.left)})}
function choose(i){
  const c=G.cur;if(!c||c.done||G.paused)return;if(!(G.state==='question'||G.state==='bossQ'))return;
  c.done=true;const a=c.ans[i];record(a,false);
  const btns=[...document.querySelectorAll('#answers .ans')];btns.forEach((b,j)=>{b.disabled=true;if(c.ans[j].ok)b.classList.add('ok');else if(j===i)b.classList.add('bad')});
  sfx(a.ok?'ok':'bad');
  let reward='';
  if(a.ok&&c.mode!=='boss'){G.cells++;G.correct++;reward='+1 ⚡ Energiezelle';if(G.hull<3){G.hull++;reward+=' · Schiff repariert ♥'}
    if(G.correct%POWER_EVERY===0){const p=POWER_ORDER[(G.correct/POWER_EVERY-1)%3];if(p==='shield')G.shields++;if(p==='joker')G.jokers++;if(p==='stretch')G.stretch++;
      reward+=' · '+({shield:'◈ Schild',joker:'J 50:50-Joker',stretch:'⏳ Zeitdehner'})[p]+' erhalten!';later(.4,()=>sfx('power'))}}
  if(c.mode==='boss'){if(a.ok){fireBeam();reward='Treffer! Der Koloss verliert Energie.'}else{G.boss.over++;reward='Der Koloss lädt sich auf – sein nächster Angriff wird stärker.'}}
  hud();
  const show=()=>feedback(a.ok?'ok':'bad',a,reward);
  if(c.gate){G.state='flythrough';G.ship.tx=laneX(i);G.ship.ty=-30;later(.55,()=>{G.ship.y=H+20;G.ship.ty=H-60;show()})}
  else later(c.mode==='boss'&&a.ok?.9:.35,show);
}
function timeout(){
  const c=G.cur;if(c.done)return;c.done=true;record(null,true);sfx('time');
  if(c.mode==='sector'){G.dock.push(c.q);feedback('time',null,'Kein Fehler: Die Frage kommt im Reparaturdock ohne Zeitdruck wieder.')}
  else if(c.mode==='boss'){if(!G.boss.retried.includes(c.q.id)){G.boss.retried.push(c.q.id);G.boss.queue.push(c.q);feedback('time',null,'Der Koloss stellt dir diese Frage am Ende noch einmal.')}
    else{G.boss.over++;feedback('bad',null,'Die Zeit ist wieder abgelaufen. Das zählt jetzt als verfehlt.')}}
}
function feedback(kind,a,reward){
  const c=G.cur,fb=$('#fb');$('#answers').classList.add('hidden');
  fb.className=kind==='ok'?'':kind;
  const head=kind==='ok'?'<h3 class="ok">✔ RICHTIG</h3>':kind==='time'?'<h3 class="time">⏱ ZEIT ABGELAUFEN</h3>':'<h3 class="bad">✘ LEIDER FALSCH</h3>';
  let body='';
  if(kind==='bad'||kind==='ok'){if(kind==='bad')body+=`<p>Richtig ist: <b class="ok">${esc(c.q.right)}</b></p>`;if(c.q.expl)body+=`<p>${esc(c.q.expl)}</p>`}
  if(kind==='bad'&&a&&a.mis)body+=`<p class="small">Mögliche Verwechslung: ${esc(a.mis)}</p>`;
  if(kind==='time'&&c.mode==='boss'&&!G.boss.queue.includes(c.q)){body+=`<p>Richtig ist: <b class="ok">${esc(c.q.right)}</b></p><p>${esc(c.q.expl)}</p>`}
  fb.innerHTML=head+body+(reward?`<p class="rw">${esc(reward)}</p>`:'')+'<button class="go" id="fGo">WEITER ▶</button>';
  fb.classList.remove('hidden');fb.scrollTop=0;G.state='feedback';

}
function next(){

  else if(p===1){const n=7+b.over*2,o=b.t;for(let k=0;k<n;k++){const a=o+k*6.283/n;G.bullets.push({x:cx,y:cy,vx:Math.cos(a)*sp*.8,vy:Math.abs(Math.sin(a))*sp*.8+20})}}
  else if(p===2){[-26,26].forEach(dx=>G.bullets.push({x:cx+dx,y:cy+12,vx:rnd(-12,12),vy:sp*1.1}))}

function endGame(reason){
  G.state='end';G.reason=reason;hideQ();duck(false);
  LS.set(KEY.log,{reason,attempts:G.attempts,date:new Date().toISOString()});
  {const b=LS.get(KEY.best,{wins:0,score:0});G.record=G.score>(b.score||0);if(G.record)b.score=G.score;if(reason==='win'){LS.del(KEY.prog);b.wins=(b.wins||0)+1}LS.set(KEY.best,b)}
  later(/^shot/.test(reason)?1.1:0,()=>endScreen(reason,G.attempts,false));
}
function analyse(att){
  const res={};
  att.forEach(a=>{const r=res[a.id]||(res[a.id]={id:a.id,to:false,ans:null,all:[]});if(a.to)r.to=true;else{r.ans=a;r.all.push(a)}});
  const cons=SET.concepts.map(c=>{
    const qs=[...SET.sectors.flatMap(s=>s.qs),...(SET.boss?SET.boss.qs:[])].filter(q=>q.concept===c.name);
    const rs=qs.map(q=>({q,r:res[q.id]})).filter(x=>x.r);
    const answered=rs.filter(x=>x.r.ans);const n=answered.length,k=answered.filter(x=>x.r.ans.ok).length;
    const jk=answered.some(x=>x.r.ans.ok&&x.r.ans.jk);const timeOk=answered.filter(x=>x.r.to&&x.r.ans.ok).length;
    const okLow=answered.some(x=>x.r.ans.ok&&x.q.afb===1),badHigh=answered.some(x=>!x.r.ans.ok&&x.q.afb>=2);
    const onlyLow=k===n&&answered.every(x=>x.q.afb===1);
    let cat,why;
    if(n===0){cat='offen';why=rs.length?'Nur Zeit abgelaufen, noch keine Antwort.':'Noch nicht erreicht.'}
    else if(n===1){cat='offen';why=k?'1 Frage richtig – zu wenig, um sicher zu sein (Raten möglich).':'1 Frage falsch – noch zu wenig Daten, schau dir die Erklärung an.'}
    else if(k===n&&!jk&&!onlyLow){cat='sicher';why=`Alle ${n} Fragen richtig, auch Anwendungsfälle.`}
    else if(k/n>=.5){cat='wack';why=jk&&k===n?'Alles richtig, aber mit Joker – noch nicht sicher.':onlyLow?'Nur Grundwissen geprüft, Anwendung fehlt noch.':okLow&&badHigh?`Grundwissen sitzt, die Anwendung auf Fälle noch nicht (${k} von ${n}).`:`${k} von ${n} richtig – teils gewusst.`}
    else{cat='ueben';why=`Nur ${k} von ${n} richtig.`}
    return {c,cat,why,n,k,timeOk,wrong:answered.filter(x=>!x.r.ans.ok)};
  });
  const misCount={};att.forEach(a=>{if(!a.to&&!a.ok&&a.mis)misCount[a.mis]=(misCount[a.mis]||0)+1});
  const mis=Object.entries(misCount).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]);
  const timeQs=Object.values(res).filter(r=>r.to).length;
  return {cons,mis,timeQs};
}
const CAT={ueben:['Üben','c-ueben','#ff5a6e'],wack:['Wackelig','c-wack','#ffe14a'],sicher:['Sicher','c-sicher','#6dff7a'],offen:['Offen','c-offen','#7a74b0']};
function kompassHTML(att){
  const A=analyse(att),ord=['ueben','wack','sicher','offen'];
  const cnt=k=>A.cons.filter(x=>x.cat===k).length;
  let h=`<div class="chips">${ord.map(k=>`<span class="chip ${CAT[k][1]}">${CAT[k][0]}: ${cnt(k)}</span>`).join('')}<span class="chip c-zeit">⏱ Zeit: ${A.timeQs}</span></div>`;
  const ue=A.cons.filter(x=>x.cat==='ueben').map(x=>x.c.name),wa=A.cons.filter(x=>x.cat==='wack').map(x=>x.c.name);
  h+=`<div class="box"><p>${ue.length?`<b style="color:var(--rd)">Zuerst üben:</b> ${esc(ue.join(', '))}.`:'Keine Themen mit großem Übungsbedarf.'} ${wa.length?`<br><b style="color:var(--ye)">Festigen:</b> ${esc(wa.join(', '))}.`:''}</p>
   ${A.timeQs?`<p class="small">⏱ ${A.timeQs} Frage(n) liefen aus der Zeit. Wurden sie im Dock richtig gelöst, ist das Wissen da – dann hilft genaueres, ruhiges Lesen oder der Ruhige Modus.</p>`:''}</div>`;
  if(A.mis.length)h+=`<div class="mis"><h4>MÖGLICHE FEHLVORSTELLUNGEN (Vermutung)</h4>${A.mis.map(([m,n])=>`<p>• ${esc(m)} <span class="small">(${n}× gewählt)</span></p>`).join('')}<p class="small">Mehrmals dieselbe Verwechslung deutet auf einen Denkfehler hin, nicht auf Zufall.</p></div>`;
  const unreached=A.cons.filter(x=>x.cat==='offen'&&x.n===0);
  ord.forEach(k=>A.cons.filter(x=>x.cat===k&&!unreached.includes(x)).forEach(x=>{
    h+=`<div class="kc" style="border-color:${CAT[k][2]}"><h4><span>${esc(x.c.name)}</span><small class="${CAT[k][1]}" style="border:0">${CAT[k][0].toUpperCase()}</small></h4>
    <div class="why">${esc(x.why)}${x.timeOk?` <span class="c-zeit" style="border:0">⏱ ${x.timeOk}× erst ohne Zeitdruck gelöst.</span>`:''}</div>
    ${x.c.ref?`<div class="small">Nachlesen: ${esc(x.c.ref)}</div>`:''}
    ${x.wrong.length?`<details><summary>${x.wrong.length} falsche Antwort${x.wrong.length>1?'en':''} ansehen</summary>${x.wrong.map(w=>`<div class="wq"><p>${esc(w.q.text)}</p><p>Deine Antwort: <em>${esc(w.r.ans.ch)}</em><br>Richtig: <strong>${esc(w.q.right)}</strong></p><p class="small">${esc(w.q.expl)}</p></div>`).join('')}</details>`:''}</div>`}));
  if(unreached.length)h+=`<div class="box"><p class="small">Noch nicht erreicht oder nur Zeit abgelaufen: ${esc(unreached.map(x=>x.c.name).join(', '))}</p></div>`;
  return h;
}
function exportText(att,reason){
  const A=analyse(att),L=[];
  L.push('# Lernkompass aus dem Lernspiel „Netto Nova“');L.push('Fach: Allgemeine Wirtschaftslehre – Sozialversicherung, Altersvorsorge, Gehaltsabrechnung, Kaufmann & Vollmachten, KG');
  L.push('Datum: '+new Date().toLocaleDateString('de-DE'));L.push('Ergebnis: '+REASON[reason][0]);L.push('');
  [['ueben','Üben'],['wack','Wackelig'],['sicher','Sicher'],['offen','Noch offen']].forEach(([k,t])=>{const xs=A.cons.filter(x=>x.cat===k);if(!xs.length)return;L.push('## '+t);
    xs.forEach(x=>{L.push(`- ${x.c.name}${x.c.ref?' ('+x.c.ref+')':''}: ${x.k} von ${x.n} richtig${x.timeOk?', '+x.timeOk+'× erst ohne Zeitdruck':''}`);
      x.wrong.forEach(w=>L.push(`  - Frage: ${w.q.text} | Meine Antwort: ${w.r.ans.ch} | Richtig: ${w.q.right}`))});L.push('')});
  if(A.timeQs){L.push('## Zeit');L.push(`- ${A.timeQs} Frage(n) liefen aus der Zeit.`);L.push('')}
  if(A.mis.length){L.push('## Mögliche Fehlvorstellungen (Vermutung)');A.mis.forEach(([m,n])=>L.push(`- ${m} (${n}×)`));L.push('')}
  L.push('Auftrag an den KI-Lerncoach:');
  L.push('1. Erkläre mir die Themen unter „Üben“ einfach und mit einem Beispiel aus der Verwaltung.');
  L.push('2. Geh auf die vermuteten Fehlvorstellungen ein und zeig mir den Unterschied.');
  L.push('3. Stell mir danach einzeln Fragen im Chat zu „Üben“ und „Wackelig“ – immer nur eine, dann warte auf meine Antwort. Nimm andere Fälle als im Spiel.');
  L.push('4. Bei Rechnungen: Lass mich den Rechenweg aufschreiben und prüfe jeden Schritt.');
  L.push('5. Sag mir am Ende kurz, was jetzt sitzt und was ich noch wiederholen sollte.');
  return L.join('\n');
}

/* ===== Schaden ===== */
function damage(){
  const s=G.ship;if(s.inv>0||!s.vis)return;
  if(G.shields>0){G.shields--;s.inv=1.2;toast('◈ Schild hat dich geschützt');sfx('power');hud();return}
  G.hull--;s.inv=1.6;sfx('hit');boom(s.x,s.y,14,['#3ff0ff','#ff3fb4','#fff']);hud();
  if(G.hull<=0){s.vis=false;sfx('boom');boom(s.x,s.y,40,['#3ff0ff','#ff3fb4','#ffe14a','#fff']);G.enemies=[];G.bullets=[];G.shots=[];endGame(G.boss?'shot_boss':'shot_sector')}
}

/* ===== Gegner ===== */
const SPD=()=>(OPT.calm?.75:1)*(1+G.sector*.12);
function spawnEnemy(type,x,y,vx,vy,extra){const T=ETYPE[type];const e=Object.assign({type,x,y,vx,vy,hp:T.hp,sc:T.sc,spr:SPR[T.spr],ph:rnd(0,6),hit:0},extra||{});G.enemies.push(e);return e}
function spawnWave(){
  const r=Math.random(),sp=SPD(),lvl=G.sector,guns=G.enemies.filter(e=>e.type==='gun').length;
  const gunP=(OPT.calm?.05:.09)+lvl*.04;
  if(r<gunP){if(guns<(OPT.calm?1:2))spawnEnemy('gun',rnd(30,W-30),-12,0,95*sp,{stopY:rnd(70,150),fireT:.9,stay:2.6,phase:'in'});return}
  if(r<gunP+.08){const cx=rnd(45,W-45);for(let i=-2;i<=2;i++)spawnEnemy('enA',cx+i*16,-10-Math.abs(i)*12,0,100*sp);return}
  if(r<gunP+.15){const dir=Math.random()<.5?-1:1;for(let i=0;i<6;i++)spawnEnemy('rock',dir>0?rnd(0,W*.6):rnd(W*.4,W),-10-i*18,dir*60*sp,150*sp);return}
  if(r<gunP+.26){spawnEnemy('big',rnd(25,W-25),-18,rnd(-10,10),58*sp);return}
  if(r<gunP+.37){spawnEnemy('mine',rnd(15,W-15),-8,rnd(-15,15),48*sp);return}
  const t=Math.random();
  if(t<.35)spawnEnemy('enA',rnd(12,W-12),-10,rnd(-20,20),115*sp);
  else if(t<.75)spawnEnemy('rock',rnd(10,W-10),-10,rnd(-25,25),rnd(95,135)*sp);
  else spawnEnemy('enB',rnd(25,W-25),-10,0,85*sp);
}
function gunFire(e){const sp=105*(OPT.calm?.75:1)*(1+.08*G.sector)*(G.boss?1+.1*G.boss.over:1),a=Math.atan2(G.ship.y-e.y,G.ship.x-e.x);
  const spread=(G.sector>=1||G.boss)&&!OPT.calm?[-.18,0,.18]:[0];spread.forEach(d=>G.bullets.push({x:e.x,y:e.y+4,vx:Math.cos(a+d)*sp,vy:Math.sin(a+d)*sp}))}
function kill(e){boom(e.x,e.y,e.sc>1?26:12,e.type==='gun'?['#b04dff','#ffe14a','#fff']:e.type==='mine'?['#ff4d4d','#ffe14a']:['#ffe14a','#ff9f1c','#fff']);G.score+=ETYPE[e.type].pts;sfx('pop');hud()}
function moveEnemies(dt){
  G.enemies.forEach(e=>{e.hit=Math.max(0,e.hit-dt);
    if(e.type==='gun'){if(e.phase==='in'){e.y+=e.vy*dt;if(e.y>=e.stopY)e.phase='hold'}
      else if(e.phase==='hold'){e.x=clamp(e.x+Math.sin(G.t*1.5+e.ph)*28*dt,12,W-12);e.stay-=dt;e.fireT-=dt;if(e.fireT<=0){gunFire(e);e.fireT=OPT.calm?1.6:1.1}if(e.stay<=0)e.phase='out'}
      else e.y+=e.vy*1.5*dt}
    else if(e.type==='enB'){e.y+=e.vy*dt;e.x+=Math.sin(G.t*3+e.ph)*65*dt}
    else if(e.type==='enA'){e.y+=e.vy*dt;e.x+=(e.vx+Math.sin(G.t*2+e.ph)*14)*dt}
    else{e.y+=e.vy*dt;e.x+=e.vx*dt}});
  G.enemies=G.enemies.filter(e=>e.hp>0&&e.y<H+24&&e.x>-50&&e.x<W+50);
}

/* ===== Update ===== */
function update(dt){
  if(G.paused)return;G.t+=dt;
  for(let i=G.timers.length-1;i>=0;i--){const tm=G.timers[i];tm.t-=dt;if(tm.t<=0){G.timers.splice(i,1);tm.fn()}}
  const slow=(G.state==='question'||G.state==='bossQ'||G.state==='feedback'||G.state==='intro'||G.state==='end')?.15:1;
  stars.forEach(s=>{s.y+=(14+s.z*80)*dt*slow*(G.boss?1.4:1);if(s.y>H){s.y=0;s.x=rnd(0,W)}});
  G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});G.parts=G.parts.filter(p=>p.l>0);
  const s=G.ship;s.inv=Math.max(0,s.inv-dt);
  const ctrl=G.state==='fly'||G.state==='bossAtk';
  if(ctrl){const sp=190;let dx=(K.r?1:0)-(K.l?1:0),dy=(K.d?1:0)-(K.u?1:0);if(dx||dy){s.tx=s.x+dx*sp*dt*3;s.ty=s.y+dy*sp*dt*3}
    s.tx=clamp(s.tx,10,W-10);s.ty=clamp(s.ty,G.boss?H*.42:H*.4,H-18)}
  const k=G.state==='flythrough'?9:ctrl?16:6;s.x+=(s.tx-s.x)*Math.min(1,dt*k);s.y+=(s.ty-s.y)*Math.min(1,dt*k);
  // eigene Schüsse (automatisch)
  if(ctrl&&s.vis){G.shotT-=dt;if(G.shotT<=0){G.shotT=.17;G.shots.push({x:s.x-3,y:s.y-6},{x:s.x+3,y:s.y-6});G.pew=(G.pew||0)+1;if(G.pew%2)sfx('pew')}}
  G.shots.forEach(q=>q.y-=320*dt);
  const b=G.boss;
  G.shots.forEach(q=>{
    for(const e of G.enemies){const hw=e.spr.width*e.sc/2+1,hh=e.spr.height*e.sc/2+2;
      if(e.hp>0&&Math.abs(q.x-e.x)<hw&&Math.abs(q.y-e.y)<hh){q.y=-99;e.hp--;e.hit=.08;if(e.hp<=0)kill(e);else sfx('tink');break}}
    if(b&&!b.dead&&q.y>-50&&Math.abs(q.x-b.x)<30&&Math.abs(q.y-b.y)<17){q.y=-99;G.parts.push({x:q.x,y:b.y+15,vx:rnd(-30,30),vy:rnd(10,40),l:.25,c:'#9ff',s:1});
      if(!b.msg){b.msg=1;toast('Nur richtige Antworten treffen!')}}});
  G.shots=G.shots.filter(q=>q.y>-8);
  if(G.state==='fly'){
    G.flyT-=dt;G.spawnT-=dt;
    if(G.spawnT<=0&&G.flyT>1.3){G.spawnT=(OPT.calm?.85:.5)-G.sector*.05;spawnWave()}
    if(G.flyT<=0&&G.state==='fly'){ask(SET.sectors[G.sector].qs[G.qi],'sector')}
  }
  if(ctrl){moveEnemies(dt);
    G.enemies.forEach(e=>{const hw=e.spr.width*e.sc/2+2,hh=e.spr.height*e.sc/2+2;
      if(s.vis&&e.hp>0&&Math.abs(e.x-s.x)<hw&&Math.abs(e.y-s.y)<hh){if(s.inv>0)return;e.hp=0;kill(e);damage()}})}
  if((G.state==='question'||G.state==='bossQ')&&G.cur&&!G.cur.done&&G.cur.left!==Infinity){
    G.cur.left-=dt;const f=Math.max(0,G.cur.left/G.cur.T);$('#qbar i').style.width=(f*100)+'%';$('#qbar').classList.toggle('low',f<.2);
    $('#qtime').textContent=Math.ceil(Math.max(0,G.cur.left))+' s';if(G.cur.left<=0)timeout()}
  if(b&&!b.dead){b.t+=dt;b.flash=Math.max(0,b.flash-dt);const ty=78;b.y+=(ty-b.y)*Math.min(1,dt*1.5);
    if(G.state==='bossAtk'||G.state==='bossDie')b.x=W/2+Math.sin(b.t*(b.rage?1.25:.8))*80;
    if(G.state==='bossAtk'){b.atkT-=dt;b.fireT-=dt;b.droneT-=dt;
      if(b.fireT<=0&&b.atkT>.8){bossFire();b.fireT=(OPT.calm?1.05:.7)/(1+.2*b.over)*(b.rage?.82:1);if(Math.random()<.4)b.pat++}
      if(b.droneT<=0&&b.atkT>2.5&&G.enemies.filter(e=>e.type==='gun').length<(OPT.calm?2:4)){[-1,1].slice(0,b.over>0||b.rage?2:1+(Math.random()<.5?1:0)).forEach(d=>spawnEnemy('gun',b.x+d*22,b.y+12,0,85,{stopY:rnd(130,200),fireT:.9,stay:2.2,phase:'in'}));b.droneT=(OPT.calm?4.5:2.6)/(1+.15*b.over)*(b.rage?.75:1)}
      if(b.atkT<=0&&G.bullets.length===0)bossAskNext();else if(b.atkT<=-2.5){G.bullets=[];bossAskNext()}}
  }
  G.bullets.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt});G.bullets=G.bullets.filter(q=>q.y<H+6&&q.y>-20&&q.x>-6&&q.x<W+6);
  if(ctrl)G.bullets.forEach(q=>{if(s.vis&&Math.abs(q.x-s.x)<5&&Math.abs(q.y-s.y)<6){q.y=H+50;damage()}});
  if(G.beam){G.beam.t-=dt;if(G.beam.t<=0)G.beam=null}
}

/* ===== Zeichnen ===== */
function render(){
  const c=ctx;const col=G.boss?SEC_COL[3]:SEC_COL[G.sector]||SEC_COL[0];
  const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#05031a');gr.addColorStop(1,col);c.fillStyle=gr;c.fillRect(0,0,W,H);
  stars.forEach(s=>{c.fillStyle=s.z>.7?'#ffffff':s.z>.4?'#9fb4ff':'#4a4a8a';c.fillRect(s.x|0,s.y|0,s.z>.85?2:1,s.z>.85?2:1)});
  c.fillStyle='rgba(255,63,180,.12)';for(let y=H-90;y<H;y+=6)c.fillRect(0,y,W,1);
  G.enemies.forEach(e=>{const w=e.spr.width*e.sc,h=e.spr.height*e.sc;if(e.hit>0)c.globalAlpha=.45;c.drawImage(e.spr,(e.x-w/2)|0,(e.y-h/2)|0,w,h);c.globalAlpha=1;
    if(e.type==='gun'&&e.phase==='hold'&&e.fireT<.4){c.fillStyle=Math.floor(G.t*20)%2?'#ffe14a':'#ffffff';c.fillRect((e.x-1)|0,(e.y+4)|0,3,3)}
    if(e.type==='mine'&&Math.floor(G.t*4+e.ph)%2){c.fillStyle='#ffffff';c.fillRect(e.x|0,e.y|0,1,1)}});
  const b=G.boss;
  if(b&&!b.dead){const bx=(b.x-32)|0,by=(b.y-17)|0;c.drawImage(SPR.boss,bx,by);
    const pulse=3+Math.sin(G.t*6)*1.2;c.fillStyle=b.flash>0?'#ffffff':'#ff2d6f';c.beginPath();c.arc(b.x,b.y+3,pulse+2,0,6.283);c.fill();c.fillStyle='#ffe14a';c.fillRect((b.x-1)|0,(b.y+2)|0,2,2);
    if(b.flash>0){c.globalAlpha=b.flash;c.fillStyle='#fff';c.fillRect(bx,by,64,34);c.globalAlpha=1}}
  if(G.beam&&b){const a=G.beam.t/.7;c.fillStyle=`rgba(63,240,255,${a})`;c.fillRect((G.ship.x-2)|0,b.y,4,G.ship.y-b.y);c.fillStyle=`rgba(255,255,255,${a})`;c.fillRect((G.ship.x-1)|0,b.y,2,G.ship.y-b.y);if(Math.abs(G.ship.x-b.x)>2){G.ship.tx=b.x}}
  c.fillStyle='#bff8ff';G.shots.forEach(q=>c.fillRect(q.x|0,q.y|0,1,4));
  G.bullets.forEach(q=>{c.fillStyle='#ff3fb4';c.fillRect((q.x-2)|0,(q.y-2)|0,4,4);c.fillStyle='#fff';c.fillRect((q.x-1)|0,(q.y-1)|0,2,2)});
  const s=G.ship;
  if(s.vis&&G.state!=='menu'&&!(s.inv>0&&Math.floor(G.t*12)%2)){
    c.drawImage(SPR.ship,(s.x-6)|0,(s.y-6)|0);const fl=Math.floor(G.t*20)%2;c.fillStyle=fl?'#ffe14a':'#ff9f1c';c.fillRect((s.x-4)|0,(s.y+5)|0,1,2+fl);c.fillRect((s.x+3)|0,(s.y+5)|0,1,2+fl);
    if(G.shields>0){c.strokeStyle='rgba(63,240,255,.35)';c.beginPath();c.arc(s.x,s.y,10,0,6.283);c.stroke()}}
  G.parts.forEach(p=>{c.globalAlpha=Math.min(1,p.l*2);c.fillStyle=p.c;c.fillRect(p.x|0,p.y|0,p.s,p.s)});c.globalAlpha=1;
}
let lastT=performance.now();
function loop(t){const dt=Math.min(.05,(t-lastT)/1000);lastT=t;try{update(dt)}catch(e){console.error(e)}render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ===== Eingabe ===== */
const K={l:0,r:0,u:0,d:0};
const KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d'};
addEventListener('keydown',e=>{
  if(!$('#modal').classList.contains('hidden')){if(e.key==='Escape'||e.key==='Enter'||e.key==='i'||e.key==='I')closeModal();return}
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){togglePause();return}
  if(e.key==='m'||e.key==='M'){auInit();setMute(!OPT.mute);return}
  if(G.paused)return;
  if(G.state==='question'||G.state==='bossQ'){
    if(/^[1-4]$/.test(e.key)&&G.cur&&+e.key<=G.cur.ans.length){const btn=document.querySelectorAll('#answers .ans')[+e.key-1];if(btn&&!btn.classList.contains('gone'))choose(+e.key-1);return}
    if(G.cur&&G.cur.gate){if(e.key==='ArrowLeft'||e.key==='a'){setSel(G.cur.sel-1);return}if(e.key==='ArrowRight'||e.key==='d'){setSel(G.cur.sel+1);return}if(e.key===' '||e.key==='Enter'){e.preventDefault();choose(G.cur.sel);return}}
  }
  if(G.state==='feedback'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next();return}
  if((e.key==='i'||e.key==='I')&&!['menu','intro','end'].includes(G.state)){openData();return}
  if(KM[e.key]){K[KM[e.key]]=1;e.preventDefault()}
});
addEventListener('keyup',e=>{if(KM[e.key])K[KM[e.key]]=0});
const wrap=$('#wrap');let drag=null;
wrap.addEventListener('pointerdown',e=>{auInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();if(e.target.closest('button,#screen,#qbox,#fb,#modal,input,label,details'))return;
  const r=wrap.getBoundingClientRect(),sc=W/r.width;drag={px:e.clientX,py:e.clientY,sx:G.ship.tx,sy:G.ship.ty,sc}});
addEventListener('pointermove',e=>{if(!drag||!(G.state==='fly'||G.state==='bossAtk'))return;G.ship.tx=drag.sx+(e.clientX-drag.px)*drag.sc*1.25;G.ship.ty=drag.sy+(e.clientY-drag.py)*drag.sc*1.25});
addEventListener('pointerup',()=>drag=null);addEventListener('pointercancel',()=>drag=null);
$('#bMute').onclick=e=>{e.stopPropagation();auInit();setMute(!OPT.mute)};
$('#bPause').onclick=e=>{e.stopPropagation();togglePause()};
$('#bData').onclick=e=>{e.stopPropagation();openData()};
$('#bJoker').onclick=e=>{e.stopPropagation();const c=G.cur;if(!c||c.done||c.joker||G.jokers<1)return;G.jokers--;c.joker=true;sfx('power');
  const wr=c.ans.map((a,i)=>a.ok?-1:i).filter(i=>i>=0);shuffle(wr).slice(0,Math.min(2,wr.length-1)).forEach(i=>document.querySelectorAll('#answers .ans')[i].classList.add('gone'));$('#bJoker').disabled=true;hud()};
$('#bStretch').onclick=e=>{e.stopPropagation();const c=G.cur;if(!c||c.done||G.stretch<1)return;G.stretch--;c.left+=30;c.T+=30;sfx('power');toast('+30 Sekunden');$('#bStretch').disabled=G.stretch<1;hud()};
function togglePause(){
  if(['menu','intro','end'].includes(G.state))return;
  G.paused=!G.paused;wrap.classList.toggle('paused',G.paused);
  if(G.paused){screen(`<h2>PAUSE</h2><p class="sub">Die Frage ist während der Pause verdeckt.</p><button class="go" id="pGo">▶ WEITER</button><button class="go alt" id="pQuit" style="margin-top:2.5cqw">Mission abbrechen</button>`);
    $('#pGo').onclick=togglePause;$('#pQuit').onclick=()=>{G.paused=false;wrap.classList.remove('paused');endGame('quit')}}
  else hideScreen();
}
function openData(){const m=$('#modal');m.innerHTML=`<div class="in"><h3>DATENBLATT</h3><p class="small">Werte 2026 (angenommen) – vergleiche mit den Werten aus dem Unterricht.</p><ul style="padding-left:1.2em">${SET.datenblatt.map(l=>`<li>${esc(l)}</li>`).join('')}</ul><button class="go" id="mClose">SCHLIESSEN</button></div>`;
  m.classList.remove('hidden');$('#mClose').onclick=closeModal;m.onclick=e=>{if(e.target===m)closeModal()}}
function closeModal(){$('#modal').classList.add('hidden')}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!G.paused&&!['menu','intro','end','feedback'].includes(G.state))togglePause()});
setMute(OPT.mute);
if(SET.errors.length)console.warn('Fragenset:',SET.errors);
menu();
</script>
</body>
</html>
