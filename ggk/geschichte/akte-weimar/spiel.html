<title>Akte Weimar</title>
<style>
:root{
  --desk:#2b2420; --desk-2:#3a302a;
  --paper:#f5eddc; --paper-2:#ece1c9; --paper-edge:#d8c8a4;
  --ink:#231f1b; --ink-soft:#574c40; --line:#c7b48d;
  --stamp:#9b2e22; --stamp-soft:#c9584a;
  --accent:#7a5527; --accent-ink:#ffffff; --accent-tint:#efe0c2;
  --ok:#2c6a38; --ok-tint:#dcebd7; --bad:#9b2e22; --bad-tint:#f6dcd6;
  --focus:#1f5fbf;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono: "Courier New",Courier,ui-monospace,Menlo,Consolas,monospace;
}
body[data-chapter="d1933"]{ --paper:#eeeae3; --paper-2:#e2ddd3; --paper-edge:#c2bbaf; --accent:#3f3b38; --accent-tint:#e2ddd5; --line:#bdb5a8; }
body[data-chapter="gg"]{ --paper:#f7f4ec; --paper-2:#ebe7dc; --paper-edge:#cfc8b6; --accent:#1f4f7c; --accent-tint:#dde8f2; --line:#c3bda9; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; font-family:var(--sans); font-size:19px; line-height:1.5; color:var(--ink);
  background:
    radial-gradient(1200px 600px at 20% -10%, #4a3c33 0%, transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 7px),
    var(--desk);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.hidden{display:none !important}

/* ---------- Kopfleiste ---------- */
.topbar{position:sticky; top:0; z-index:20; background:rgba(30,25,22,.96); color:#f3e9d6; border-bottom:1px solid #000;
  padding:8px max(12px, env(safe-area-inset-left)); }
.topbar-inner{max-width:900px; margin:0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.brand{font-family:var(--serif); font-size:20px; letter-spacing:.06em; font-variant:small-caps; white-space:nowrap}
.meta{display:flex; gap:14px; font-family:var(--mono); font-size:18px; margin-left:auto; align-items:center; flex-wrap:wrap}
.meta span{white-space:nowrap}
.tbtn{min-height:44px; min-width:44px; padding:6px 12px; border-radius:8px; border:1px solid #6d5d4f; background:#3b322c; color:#f3e9d6; font-size:18px}
.tbtn:hover{background:#4a3f37}
.seals{max-width:900px; margin:6px auto 0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.seal-btn{border:0; background:none; padding:0; min-width:44px; min-height:44px; display:grid; place-items:center}
.seal-btn[disabled]{cursor:default}
.seal-btn svg{width:42px; height:42px}

/* ---------- Papier ---------- */
main{padding:18px 12px 60px}
.sheet{
  max-width:860px; margin:0 auto; background:
   radial-gradient(900px 300px at 50% 0%, rgba(255,255,255,.55), transparent 70%),
   linear-gradient(180deg, var(--paper), var(--paper-2));
  border:1px solid var(--paper-edge); border-radius:6px; padding:28px clamp(16px,4vw,44px) 36px;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 18px 40px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  position:relative;
}
.sheet::before{content:""; position:absolute; left:0; right:0; top:0; height:10px; border-radius:6px 6px 0 0;
  background:repeating-linear-gradient(90deg, var(--accent) 0 40px, transparent 40px 46px); opacity:.85}
.kicker{font-family:var(--mono); font-size:18px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:6px 0 4px}
h1,h2,h3{font-family:var(--serif); font-weight:700; line-height:1.2; margin:.2em 0 .5em}
h1{font-size:clamp(34px,6vw,52px)}
h2{font-size:clamp(28px,4.5vw,38px)}
h3{font-size:22px}
p{margin:.55em 0}
.lead{font-size:20px}
.fiction{font-size:18px; color:var(--ink-soft); border-left:4px solid var(--line); padding:4px 12px; margin:16px 0}
.stamp{display:inline-block; font-family:var(--mono); font-weight:700; color:var(--stamp); border:3px solid var(--stamp);
  padding:4px 12px; transform:rotate(-4deg); letter-spacing:.12em; text-transform:uppercase; opacity:.85; font-size:18px}

/* Aktennotiz */
.note{position:relative; background:#fffbe9; border:1px solid #e2d59f; padding:16px 18px 14px 18px; margin:18px 0;
  box-shadow:2px 3px 0 rgba(0,0,0,.07); transform:rotate(-.4deg); font-family:var(--serif); font-size:20px}
body[data-chapter="d1933"] .note{background:#f7f5ef; border-color:#d3cdbf}
body[data-chapter="gg"] .note{background:#fdfcf6; border-color:#dcd6c2}
.note .from{display:block; font-family:var(--mono); font-size:18px; color:var(--ink-soft); margin-bottom:4px}
.clip{position:absolute; top:-14px; right:24px; width:22px; height:46px}

/* Material */
.material{background:#fffdf6; border:1px solid var(--line); border-radius:4px; margin:16px 0; position:relative}
.material .tab{display:inline-block; font-family:var(--mono); font-weight:700; background:var(--accent); color:var(--accent-ink);
  padding:4px 12px; border-radius:0 0 6px 0; font-size:18px}
.material .mt{font-family:var(--serif); font-weight:700; font-size:20px; padding:10px 16px 0}
.material .mb{padding:4px 16px 14px}
.material .src{font-size:18px; color:var(--ink-soft); font-style:italic}
.material ul{padding-left:1.2em; margin:.4em 0}
.material li{margin:.35em 0}
.card{border:1px dashed var(--line); border-radius:4px; padding:10px 12px; margin:10px 0; background:rgba(255,255,255,.6)}
.card b.no{font-family:var(--mono); color:var(--accent)}
.tbl{border-collapse:collapse; width:100%; font-size:18px}
.tbl th,.tbl td{border:1px solid var(--line); padding:8px 6px; text-align:center}
.tbl th{background:var(--accent-tint)}
.tblwrap{overflow-x:auto}

/* Aufgabe */
.task{border:2px solid var(--accent); border-radius:6px; padding:16px; margin:22px 0 10px; background:rgba(255,255,255,.55)}
.task .tl{font-family:var(--mono); font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.08em; font-size:18px}
.row{padding:12px 0; border-top:1px dotted var(--line)}
.row:first-of-type{border-top:0}
.stmt{margin:0 0 8px}
.stmt .n{display:inline-block; min-width:30px; font-family:var(--mono); font-weight:700; color:var(--accent)}
.opts{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.opts.compact{grid-template-columns:repeat(auto-fit,minmax(52px,1fr))}
.opts.wide{grid-template-columns:1fr}
@media(min-width:620px){ .opts.wide{grid-template-columns:1fr 1fr} }
.opt{min-height:48px; border:2px solid var(--line); background:#fffdf8; border-radius:8px; padding:6px 10px; font-size:18px; line-height:1.25; text-align:center}
.opts.wide .opt{text-align:left}
.opt .k{font-family:var(--mono); font-weight:700; font-size:20px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.numrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.numrow label{flex:1 1 260px}
.num{width:150px; min-height:48px; font-family:var(--mono); font-size:22px; padding:6px 10px; border:2px solid var(--line); border-radius:8px; background:#fff}
.codebar{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:16px; padding-top:14px; border-top:2px solid var(--line)}
.codeview{font-family:var(--mono); font-size:22px; letter-spacing:.15em; background:#fff; border:1px solid var(--line); padding:6px 12px; border-radius:6px}
.btn{min-height:48px; padding:8px 18px; border-radius:8px; border:2px solid var(--accent); background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:19px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.small{min-height:44px; font-size:18px; padding:6px 14px}
.feedback{margin-top:12px; padding:10px 14px; border-radius:6px; font-weight:600}
.feedback.bad{background:var(--bad-tint); color:var(--bad); border:1px solid #e3b3aa}
.feedback.info{background:#eef0f4; color:#2a3646; border:1px solid #cdd3dd}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Hinweise */
.hints{margin-top:22px; border-top:1px solid var(--line); padding-top:12px}
.hints h3{font-size:20px; margin:0 0 6px}
.hint{background:#fff7d6; border-left:5px solid #c9a227; padding:8px 12px; margin:8px 0; border-radius:0 6px 6px 0}
.hint b{font-family:var(--mono)}
.pulse{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,162,39,.0)}50%{box-shadow:0 0 0 8px rgba(201,162,39,.45)}}

/* Erfolg */
.success{border:2px solid var(--ok); background:var(--ok-tint); border-radius:8px; padding:18px; margin-top:18px}
.success h3{color:var(--ok); margin-top:0}
.success .sb{background:#fff; border:1px dashed var(--ok); padding:8px 12px; border-radius:6px; margin:10px 0}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}

/* Start / Final */
.field{margin:14px 0}
.field label{display:block; font-weight:700; margin-bottom:4px}
.txt{width:100%; max-width:420px; min-height:48px; font-size:20px; padding:6px 12px; border:2px solid var(--line); border-radius:8px; background:#fff}
.sel{min-height:48px; font-size:20px; padding:6px 10px; border:2px solid var(--line); border-radius:8px; background:#fff}
.finalbox{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin:18px 0}
.fbit{background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 14px}
.fbit .l{font-family:var(--mono); font-size:18px; color:var(--ink-soft)}
.fbit .v{font-size:24px; font-weight:700}
.pruef{font-family:var(--mono); font-size:clamp(34px,8vw,54px); font-weight:700; letter-spacing:.12em; color:var(--stamp); border:4px double var(--stamp); display:inline-block; padding:6px 18px; transform:rotate(-2deg); background:#fff}
.footer{max-width:860px; margin:14px auto 0; color:#bfae95; font-size:18px; text-align:center}
.footer a{color:#e8d6b8}
.warn{font-size:18px; color:#7a4b00; background:#fff2d2; border:1px solid #e9cf8c; padding:6px 10px; border-radius:6px}

/* Dialoge */
.overlay{position:fixed; inset:0; background:rgba(10,8,6,.6); z-index:50; display:grid; place-items:center; padding:16px}
.dialog{background:var(--paper); border:1px solid var(--paper-edge); border-radius:8px; max-width:640px; width:100%; max-height:88vh; overflow:auto; padding:22px; box-shadow:0 20px 50px rgba(0,0,0,.5)}
.dialog dl{margin:0}
.dialog dt{font-weight:700; font-family:var(--serif); font-size:20px; margin-top:12px}
.dialog dd{margin:2px 0 0 0}

/* ---------- Beamer ---------- */
body.beamer{background:#120f0d; color:#f1e7d4; overflow:hidden}
.bm{position:fixed; inset:0; display:flex; flex-direction:column}
.bm-stage{flex:1; display:flex; flex-direction:column; justify-content:center; padding:4vh 7vw; position:relative; overflow:hidden}
.bm-stage::before{content:""; position:absolute; inset:-20%; background:radial-gradient(60% 50% at 30% 30%, var(--bm-glow, rgba(180,120,60,.25)), transparent 70%); animation:drift 24s ease-in-out infinite alternate; pointer-events:none}
@keyframes drift{from{transform:translate(-3%,-2%)}to{transform:translate(4%,3%)}}
.bm-kicker{font-family:var(--mono); letter-spacing:.2em; text-transform:uppercase; font-size:clamp(18px,1.6vw,26px); color:var(--bm-accent,#d8a866); position:relative}
.bm-title{font-family:var(--serif); font-size:clamp(40px,5.4vw,92px); line-height:1.08; margin:.25em 0 .35em; position:relative}
.bm-text{font-family:var(--serif); font-size:clamp(22px,2.1vw,36px); max-width:62ch; line-height:1.45; position:relative; color:#e9dcc4}
.bm-text p{margin:.4em 0}
.bm-stage.withqr .bm-text,.bm-stage.withqr .bm-title{max-width:calc(100% - min(26vw,300px) - 2vw)}
.bm-side{position:absolute; right:4vw; top:4vh; text-align:right; font-family:var(--mono)}
.bm-time{font-size:clamp(28px,3vw,52px); color:#f1e7d4}
.bm-qr{position:absolute; right:4vw; bottom:3vh; background:#fff; padding:12px; border-radius:8px; text-align:center; color:#222; font-family:var(--sans); font-size:16px; width:min(26vw,300px)}
.bm-qr svg{width:min(22vh,240px); height:min(22vh,240px); display:block; margin:0 auto 6px}
.bm-url{word-break:break-all}
.bm-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; background:rgba(0,0,0,.55); border-top:1px solid #33291f; transition:opacity .4s}
.bm-bar.dim{opacity:.08}
.bm-bar:hover{opacity:1}
.bm-btn{min-height:44px; padding:6px 14px; border-radius:8px; border:1px solid #6a5643; background:#2a221c; color:#f1e7d4; font-size:18px}
.bm-btn[aria-pressed="true"]{background:#d8a866; color:#1b140e; border-color:#d8a866}
.bm-bar label{font-size:18px; display:flex; align-items:center; gap:6px}
.bm-bar input[type=range]{width:140px}
.bm-sep{flex:1}
.bm-help{font-size:16px; color:#a99676}
.bm-status{display:inline-flex; align-items:center; gap:8px; font-size:18px; min-width:220px}
.bm-meter{width:90px; height:12px; border-radius:6px; background:#3a2f26; overflow:hidden}
.bm-meter i{display:block; height:100%; width:0; background:linear-gradient(90deg,#7bbf6a,#e0c25e); transition:width .12s}
.bm-status.warn{color:#ffb4a2}
</style>
</head>

function cyrb53(str, seed){seed=seed||0;var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);}

function normText(s){
  return String(s||"").toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[^a-z0-9]/g,"");
}
/* tolerante Normalisierung von Zahleneingaben: Leerzeichen, Einheiten, Tausenderpunkte, Komma */
function normNumber(s){
  var t = String(s||"").toLowerCase().trim();
  t = t.replace(/art(ikel|\.)?/g,"").replace(/sitze?|jahre?|stimmen|abs\.?.*$/g,"").replace(/[€%§\s]/g,"");
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g,"");
  t = t.replace(",",".");
  if(t==="" ) return "";
  var n = Number(t);
  if(!isFinite(n)) return "x" + normText(s);
  return String(n);
}

function sealSVG(label, status){ /* status: open | current | locked */
  var pts=[], n=18; for(var i=0;i<n*2;i++){ var r=(i%2)?44:48, a=Math.PI*i/n; pts.push((50+r*Math.cos(a)).toFixed(1)+","+(50+r*Math.sin(a)).toFixed(1)); }
  var fill = status==="open" ? "#3f7a4b" : (status==="current" ? "#a83224" : "#7d6d60");
  var inner = status==="open" ? "#5c9a68" : (status==="current" ? "#c4473a" : "#968677");
  var crack = status==="open" ? "<path d='M30 22 L48 46 L40 54 L62 80' stroke='#e9f3ea' stroke-width='5' fill='none' stroke-linecap='round'/>" : "";
  var txt = status==="open" ? "" : "<text x='50' y='59' text-anchor='middle' font-family='Georgia,serif' font-size='"+(label.length>2?24:30)+"' font-weight='700' fill='#fff7ea'>"+label+"</text>";
  var anim = status==="current" ? "<animateTransform attributeName='transform' type='scale' values='1;1.06;1' dur='2.4s' repeatCount='indefinite' additive='sum'/>" : "";
  return "<svg viewBox='0 0 100 100' aria-hidden='true'><g transform-origin='50 50'>"+anim+"<polygon points='"+pts.join(" ")+"' fill='"+fill+"'/><circle cx='50' cy='50' r='34' fill='"+inner+"' stroke='rgba(0,0,0,.2)' stroke-width='3'/>"+txt+crack+"</g></svg>";
}
var CLIP = "<svg class='clip' viewBox='0 0 22 46' aria-hidden='true'><path d='M6 40 V8 a5 5 0 0 1 10 0 V36 a3 3 0 0 1 -6 0 V12' fill='none' stroke='#8a8f96' stroke-width='2.4' stroke-linecap='round'/></svg>";

/* =====================================================================
   SPIEL (Schüleransicht)
   ===================================================================== */
var state, ui = { view:null, feedback:{}, justSolved:null, timerId:null };

function newState(){ return { v:1, phase:"start", group:"", nr:0, started:0, finished:0, cur:0, solved:[], zSolved:false, teacher:[], hints:{}, wrong:{}, answers:{} }; }
function loadState(){
  var s = Store.load();
  if(!s || s.v!==1) s = newState();
  /* Plausibilitätsprüfung: keine Abkürzungen über manipulierte Spielstände */
  var n = CONFIG.stations.length;
  s.solved = (s.solved||[]).filter(function(id){ return CONFIG.stations.some(function(st){return st.id===id;}); });
  s.cur = Math.min(Math.max(0, s.solved.length), n);
  if(s.phase==="final" && s.solved.length<n) s.phase="play";
  if(s.phase==="z" && s.solved.length<n) s.phase="play";
  return s;
}
function save(){ Store.save(state); }
function stationById(id){ if(id==="z") return CONFIG.extra; for(var i=0;i<CONFIG.stations.length;i++) if(CONFIG.stations[i].id===id) return CONFIG.stations[i]; return null; }
function totalHints(){ var t=0; for(var k in state.hints) t+=state.hints[k]; return t; }
function elapsed(){ if(!state.started) return 0; return (state.finished||Date.now()) - state.started; }

function setChapter(ch){ document.body.setAttribute("data-chapter", ch==="d1933" ? "d1933" : (ch==="gg" ? "gg" : "weimar")); }

function render(){
  var app = document.getElementById("app");
  var html = "";
  if(state.phase==="start"){ setChapter("weimar"); html = renderTop(false) + "<main>" + renderStart() + "</main>" + renderFooter(); }
  else if(state.phase==="final"){ setChapter("gg"); html = renderTop(true) + "<main>" + renderFinal() + "</main>" + renderFooter(); }
  else {
    var st = currentStation();
    setChapter(st.chapter);
    html = renderTop(true) + "<main>" + renderStation(st) + "</main>" + renderFooter();
  }
  app.innerHTML = html;
  bindCommon();
  window.scrollTo(0, ui.keepScroll ? ui.keepScroll : 0); ui.keepScroll = 0;
}
function currentStation(){
  if(ui.view) return stationById(ui.view);
  if(state.phase==="z") return CONFIG.extra;
  return CONFIG.stations[Math.min(state.cur, CONFIG.stations.length-1)];
}

function renderTop(withMeta){
  var seals = "";
  if(withMeta){
    seals = "<div class='seals' role='navigation' aria-label='Fortschritt'>";
    CONFIG.stations.forEach(function(st, i){
      var done = state.solved.indexOf(st.id)>=0;
      var cur = !done && i===state.cur && state.phase==="play";
      var status = done ? "open" : (cur ? "current" : "locked");
      var lbl = "Siegel " + st.seal + (done ? " – geöffnet, ansehen" : (cur ? " – aktuelle Station" : " – verschlossen"));
      seals += "<button class='seal-btn' data-seal='"+st.id+"' "+(done||cur?"":"disabled")+" aria-label='"+lbl+"' title='"+lbl+"'>"+sealSVG(st.seal,status)+"</button>";
    });
    if(state.solved.length===CONFIG.stations.length){
      var zs = state.zSolved ? "open" : (state.phase==="z" ? "current" : "locked");
      seals += "<button class='seal-btn' data-seal='z' aria-label='Zusatzakte' title='Zusatzakte Z'>"+sealSVG("Z", zs)+"</button>";
    }
    seals += "</div>";
  }
  return "<header class='topbar'><div class='topbar-inner'>" +
    "<span class='brand'>Akte Weimar</span>" +
    (withMeta ? "<span class='meta'><span title='Gruppe'>▣ "+esc(state.group)+" ("+state.nr+")</span><span title='Verstrichene Zeit'>⏱ <span id='clock'>"+fmtTime(elapsed())+"</span></span><span title='Genutzte Hinweise'>💡 "+totalHints()+"</span></span>" : "<span class='meta'></span>") +
    "<button class='tbtn' id='btnGloss'>Glossar</button><button class='tbtn' id='btnMenu' aria-label='Menü'>☰</button>" +
    "</div>" + seals + "</header>";
}
function renderFooter(){
  return "<p class='footer'>Version "+CONFIG.version+" · Für Lehrkräfte: <a href='"+esc(studentURL())+"#beamer' target='_top' id='lnkBeamer'>Beamer-Ansicht</a></p>";
}

function renderStart(){
  var c = CONFIG.start, opts = "<option value=''>bitte wählen</option>";
  for(var i=1;i<=CONFIG.maxGroups;i++) opts += "<option value='"+i+"'>Gruppe "+i+"</option>";
  return "<section class='sheet'>" +
    "<p class='kicker'>"+esc(c.kicker)+"</p><h1>"+esc(c.title)+"</h1><p class='lead'><i>"+esc(c.subtitle)+"</i></p>" +
    "<p><span class='stamp'>Vertraulich</span></p>" +
    c.story.map(function(p){return "<p>"+esc(p)+"</p>";}).join("") +
    "<p class='fiction'>"+esc(c.fiction)+"</p>" +
    "<div class='field'><label for='gname'>Name Ihres Archivteams</label><input id='gname' class='txt' maxlength='30' autocomplete='off' placeholder='z. B. Team Bonn' value='"+esc(state.group)+"'></div>" +
    "<div class='field'><label for='gnr'>Gruppennummer (von der Lehrkraft)</label><select id='gnr' class='sel'>"+opts+"</select></div>" +
    "<p class='fiction' style='border-color:#c9a227'>Bitte keine echten Namen eintragen – ein Teamname genügt.</p>" +
    "<div id='startFb'></div>" +
    "<button class='btn' id='btnStart'>Akte öffnen</button>" +
    (Store.ok ? "" : "<p class='warn'>Auf diesem Gerät kann der Spielstand nicht gespeichert werden. Bitte die Seite nicht neu laden.</p>") +
    "</section>";
}

function renderStation(st){
  var solved = st.id==="z" ? state.zSolved : state.solved.indexOf(st.id)>=0;
  var review = !!ui.view && solved && ui.justSolved!==st.id;
  var ans = state.answers[st.id] || {};
  var h = "<section class='sheet' id='station' data-id='"+st.id+"'>";
  h += "<p class='kicker'>"+esc(st.kicker)+"</p><h2>"+esc(st.title)+"</h2>";
  if(review) h += "<p class='warn'>Diese Akte ist bereits geöffnet. Sie sehen sie noch einmal zum Nachlesen. <button class='btn small ghost' id='btnBack'>Zur aktuellen Station</button></p>";
  h += "<div class='note'>"+CLIP+"<span class='from'>Aktennotiz · Dr. L. Hartmann</span>"+esc(st.note)+"</div>";
  st.materials.forEach(function(m){
    h += "<div class='material'><span class='tab'>"+esc(m.tab)+"</span><div class='mt'>"+esc(m.title)+"</div><div class='mb'>"+m.html+"</div></div>";
  });
  h += "<div class='task'><div class='tl'>Auftrag</div><p>"+st.task+"</p>";
  st.fields.forEach(function(f){
    if(f.type==="choice"){
      var vals = ans[f.id] || [];
      f.rows.forEach(function(r, ri){
        h += "<div class='row'><p class='stmt'>"+(f.rows.length>1?"<span class='n'>"+(ri+1)+".</span>":"")+esc(r)+"</p><div class='opts"+(f.compact?" compact":"")+(f.wide?" wide":"")+"' role='group' aria-label='Antwort zu "+(ri+1)+"'>";
        f.options.forEach(function(o){
          var pressed = vals[ri]===o.k;
          h += "<button class='opt' data-field='"+f.id+"' data-row='"+ri+"' data-k='"+o.k+"' aria-pressed='"+pressed+"' "+(solved?"disabled":"")+"><span class='k'>"+o.k+"</span>"+(o.l?(f.wide?" – ":"<br>")+o.l:"")+"</button>";
        });
        h += "</div></div>";
      });
    } else {
      h += "<div class='row numrow'><label for='f_"+f.id+"'>"+esc(f.label)+"</label><input class='num' id='f_"+f.id+"' data-field='"+f.id+"' inputmode='numeric' autocomplete='off' value='"+esc(ans[f.id]||"")+"' "+(solved?"disabled":"")+"></div>";
    }
  });
  if(!solved){
    h += "<div class='codebar'><span>Ihr Code:</span><span class='codeview' id='codeview'>"+esc(codePreview(st))+"</span><button class='btn' id='btnCheck'>Siegel öffnen</button></div>";
    var fb = ui.feedback[st.id];
    h += "<div id='fb' aria-live='polite'>"+(fb?"<div class='feedback "+fb.cls+"'>"+fb.msg+"</div>":"")+"</div>";
  }
  h += "</div>";
  if(solved && !review){
    h += renderSuccess(st);
  } else if(solved && review){
    h += "<div class='success'><h3>Kernaussage</h3><p>"+esc(st.core)+"</p></div>";
  }
  if(!solved) h += renderHints(st);
  h += "</section>";
  return h;
}
function codePreview(st){
  var ans = state.answers[st.id] || {}, parts=[];
  st.fields.forEach(function(f){
    if(f.type==="choice"){ var v=ans[f.id]||[]; parts.push(f.rows.map(function(_,i){return v[i]||"–";}).join(" ")); }
    else parts.push((ans[f.id]||"").trim() || "___");
  });
  return parts.join("  |  ");
}
function renderHints(st){
  var used = state.hints[st.id]||0, wrong = state.wrong[st.id]||0;
  var h = "<div class='hints'><h3>Hinweise der Archivarin</h3>";
  for(var i=0;i<used;i++) h += "<div class='hint'><b>Hinweis "+(i+1)+":</b> "+esc(st.hints[i])+"</div>";
  if(used<3){
    var names=["Denkanstoß","Vorgehen","fast die Lösung"];
    h += "<button class='btn small ghost"+(wrong>=CONFIG.wrongBeforeHint?" pulse":"")+"' id='btnHint'>Hinweis "+(used+1)+" anzeigen ("+names[used]+")</button>";
  } else h += "<p>Alle Hinweise genutzt. Wenn Sie nicht weiterkommen, melden Sie sich bei Ihrer Lehrkraft.</p>";
  return h + "</div>";
}
function renderSuccess(st){
  var byTeacher = state.teacher.indexOf(st.id)>=0;
  var h = "<div class='success' id='success'><h3>"+(byTeacher?"Von der Lehrkraft freigeschaltet":"Siegel "+st.seal+" ist geöffnet!")+"</h3>";
  h += "<p><b>Kernaussage:</b> "+esc(st.core)+"</p>";
  h += "<div class='sb'>✎ "+esc(st.sicherung)+"</div><div class='btnrow'>";
  var idx = CONFIG.stations.indexOf(st);
  if(st.id==="z") h += "<button class='btn' id='btnFinal'>Zum Abschluss</button>";
  else if(idx < CONFIG.stations.length-1) h += "<button class='btn' id='btnNext'>Weiter zu Siegel "+CONFIG.stations[idx+1].seal+"</button>";
  else { h += "<button class='btn' id='btnFinal'>Akte abschließen</button><button class='btn ghost' id='btnExtra'>Zusatzakte Z öffnen (für schnelle Teams)</button>"; }
  return h + "</div></div>";
}
function renderFinal(){
  var c = CONFIG.final;
  var t = state.teacher.length;
  return "<section class='sheet'><p class='kicker'>"+esc(c.kicker)+"</p><h1>"+esc(c.title)+"</h1><p class='lead'>"+esc(c.text)+"</p>" +
    "<div class='finalbox'>" +
    "<div class='fbit'><div class='l'>Archivteam</div><div class='v'>"+esc(state.group)+"</div></div>" +
    "<div class='fbit'><div class='l'>Gruppennummer</div><div class='v'>"+state.nr+"</div></div>" +
    "<div class='fbit'><div class='l'>Benötigte Zeit</div><div class='v'>"+fmtTime(elapsed())+"</div></div>" +
    "<div class='fbit'><div class='l'>Genutzte Hinweise</div><div class='v'>"+totalHints()+"</div></div>" +
    "<div class='fbit'><div class='l'>Lehrkraft-Freischaltungen</div><div class='v'>"+t+"</div></div>" +
    "<div class='fbit'><div class='l'>Zusatzakte Z</div><div class='v'>"+(state.zSolved?"gelöst ★":"offen")+"</div></div>" +
    "</div><p>Prüfcode für die Lehrkraft:</p><p><span class='pruef' id='pruefcode'>"+pruefcode(state.nr)+"</span></p>" +
    "<div class='success'><p>✎ "+esc(c.sicherung)+"</p></div>" +
    (state.zSolved ? "" : "<div class='btnrow'><button class='btn ghost' id='btnExtra'>Noch Zeit? Zusatzakte Z öffnen</button></div>") +
    "</section>";
}

/* ---------- Ereignisse ---------- */
function bindCommon(){
  on("btnGloss","click",openGlossary);
  on("btnMenu","click",openMenu);
  on("btnStart","click",startGame);
  on("btnCheck","click",checkStation);
  on("btnHint","click",showHint);
  on("btnNext","click",function(){ ui.justSolved=null; ui.view=null; ui.feedback={}; render(); });
  on("btnFinal","click",goFinal);
  on("btnExtra","click",function(){ ui.justSolved=null; ui.view=null; state.phase="z"; save(); render(); });
  on("btnBack","click",function(){ ui.view=null; render(); });
  Array.prototype.forEach.call(document.querySelectorAll(".seal-btn"), function(b){
    b.addEventListener("click", function(){
      var id=b.getAttribute("data-seal");
      if(id==="z"){ if(state.zSolved){ ui.view="z"; ui.justSolved=null; render(); } else { ui.view=null; state.phase="z"; save(); render(); } return; }
      var solved = state.solved.indexOf(id)>=0;
      if(solved){ ui.view=id; ui.justSolved=null; render(); }
      else { ui.view=null; if(state.phase==="z"||state.phase==="final"){} render(); }
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".opt"), function(b){
    b.addEventListener("click", function(){
      var st=currentStation(), f=b.getAttribute("data-field"), r=+b.getAttribute("data-row"), k=b.getAttribute("data-k");
      var a = state.answers[st.id] || (state.answers[st.id]={}); var arr = a[f] || (a[f]=[]);
      arr[r] = k; save();
      Array.prototype.forEach.call(b.parentNode.querySelectorAll(".opt"), function(o){ o.setAttribute("aria-pressed", o===b ? "true" : "false"); });
      var cv=document.getElementById("codeview"); if(cv) cv.textContent = codePreview(st);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("input.num"), function(inp){
    inp.addEventListener("input", function(){
      var st=currentStation(); var a = state.answers[st.id] || (state.answers[st.id]={});
      a[inp.getAttribute("data-field")] = inp.value; save();
      var cv=document.getElementById("codeview"); if(cv) cv.textContent = codePreview(st);
    });
    inp.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); checkStation(); } });
  });
}
function on(id, ev, fn){ var el=document.getElementById(id); if(el) el.addEventListener(ev, fn); }

function startGame(){
  var name = (document.getElementById("gname").value||"").trim();
  var nr = parseInt(document.getElementById("gnr").value,10);
  var fb = document.getElementById("startFb");
  if(!name || !nr){ fb.innerHTML = "<div class='feedback bad'>Bitte geben Sie einen Teamnamen ein und wählen Sie Ihre Gruppennummer.</div>"; return; }
  state.group = name.slice(0,30); state.nr = nr; state.started = Date.now(); state.phase = "play"; state.cur = 0;
  save(); render(); startClock();
}
function buildAnswer(st){
  var ans = state.answers[st.id] || {}, parts=[], complete=true;
  st.fields.forEach(function(f){
    if(f.type==="choice"){ var v=ans[f.id]||[]; for(var i=0;i<f.rows.length;i++) if(!v[i]) complete=false; parts.push(f.rows.map(function(_,i){return v[i]||"";}).join("")); }
    else { var n=normNumber(ans[f.id]); if(n==="") complete=false; parts.push(n); }
  });
  return { complete:complete, value:parts.join("|") };
}
function checkStation(){
  var st = currentStation();
  var a = buildAnswer(st);
  if(!a.complete){ ui.feedback[st.id] = {cls:"info", msg:"Bitte füllen Sie zuerst alle Felder aus."}; refreshFeedback(st); return; }
  if(pruefwert(st.id, a.value) === st.check){ markSolved(st, false); return; }
  state.wrong[st.id] = (state.wrong[st.id]||0)+1; save();
  var w = state.wrong[st.id];
  var msg = "Das Siegel bleibt verschlossen – mindestens eine Angabe stimmt noch nicht. (Fehlversuch "+w+")";
  if(w>=CONFIG.wrongBeforeHint && (state.hints[st.id]||0)<3) msg += "<br>Tipp: Rufen Sie unten einen Hinweis der Archivarin ab.";
  ui.feedback[st.id] = {cls:"bad", msg:msg};
  refreshFeedback(st, true);
}
function refreshFeedback(st, shake){
  ui.keepScroll = window.scrollY; render();
  var el=document.getElementById("fb"); if(el){ if(shake){ el.classList.add("shake"); } }
}
function markSolved(st, byTeacher){
  if(st.id==="z"){ state.zSolved = true; }
  else if(state.solved.indexOf(st.id)<0){ state.solved.push(st.id); state.cur = state.solved.length; }
  if(byTeacher && state.teacher.indexOf(st.id)<0) state.teacher.push(st.id);
  ui.justSolved = st.id; ui.view = st.id; delete ui.feedback[st.id];
  save(); render();
  var s=document.getElementById("success"); if(s && s.scrollIntoView) s.scrollIntoView({behavior:"smooth", block:"center"});
}
function showHint(){
  var st=currentStation(); state.hints[st.id] = Math.min(3,(state.hints[st.id]||0)+1); save();
  ui.keepScroll = window.scrollY; render();
}
function goFinal(){
  ui.view=null; ui.justSolved=null; state.phase="final"; if(!state.finished) state.finished = Date.now(); save(); render();
}

/* ---------- Dialoge ---------- */
function openDialog(html){
  var ov = document.createElement("div"); ov.className="overlay"; ov.innerHTML = "<div class='dialog' role='dialog' aria-modal='true'>"+html+"</div>";
  ov.addEventListener("click", function(e){ if(e.target===ov) closeDialog(); });
  document.body.appendChild(ov);
  var f = ov.querySelector("input,button"); if(f) f.focus();
  return ov;
}
function closeDialog(){ var o=document.querySelector(".overlay"); if(o) o.remove(); }
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeDialog(); });
function openGlossary(){
  var h="<h2>Glossar</h2><dl>";
  CONFIG.glossary.forEach(function(g){ h+="<dt>"+esc(g[0])+"</dt><dd>"+esc(g[1])+"</dd>"; });
  h+="</dl><div class='btnrow'><button class='btn' id='dClose'>Schließen</button></div>";
  openDialog(h); on("dClose","click",closeDialog);
}
function openMenu(){
  var h="<h2>Menü</h2>" +
    "<h3>Lehrkraft</h3><p>Mit dem Lehrkraftcode wird die aktuelle Station freigeschaltet.</p>" +
    "<div class='numrow'><input id='tcode' class='txt' type='password' autocomplete='off' placeholder='Lehrkraftcode' aria-label='Lehrkraftcode'><button class='btn' id='tGo'>Freischalten</button></div><div id='tFb'></div>" +
    "<h3 style='margin-top:20px'>Neustart</h3><p>Löscht den gesamten Spielstand auf diesem Gerät.</p><button class='btn ghost' id='rGo'>Spiel neu starten …</button>" +
    "<div class='btnrow' style='margin-top:20px'><button class='btn' id='dClose'>Schließen</button></div>";
  openDialog(h);
  on("dClose","click",closeDialog);
  on("tGo","click",teacherUnlock);
  var tc=document.getElementById("tcode"); if(tc) tc.addEventListener("keydown",function(e){ if(e.key==="Enter") teacherUnlock(); });
  on("rGo","click",function(){
    closeDialog();
    openDialog("<h2>Wirklich neu starten?</h2><p>Der gesamte Spielstand dieser Gruppe wird gelöscht. Das kann nicht rückgängig gemacht werden.</p><div class='btnrow'><button class='btn' id='rNo'>Abbrechen</button><button class='btn ghost' id='rYes'>Ja, alles löschen</button></div>");
    on("rNo","click",closeDialog);
    on("rYes","click",function(){ Store.clear(); state=newState(); ui={view:null,feedback:{},justSolved:null}; closeDialog(); render(); });
  });
}
function teacherUnlock(){
  var v = document.getElementById("tcode").value, fb=document.getElementById("tFb");
  if(cyrb53(CONFIG.salt + "LEHRKRAFT|" + normText(v)) !== CONFIG.teacherCheck){ fb.innerHTML="<div class='feedback bad'>Code nicht korrekt.</div>"; return; }
  if(state.phase!=="play" && state.phase!=="z"){ fb.innerHTML="<div class='feedback info'>Gerade ist keine Station geöffnet.</div>"; return; }
  var st = state.phase==="z" ? CONFIG.extra : CONFIG.stations[state.cur];
  if(!st || (st.id!=="z" && state.solved.indexOf(st.id)>=0) || (st.id==="z" && state.zSolved)){ fb.innerHTML="<div class='feedback info'>Die aktuelle Station ist bereits gelöst.</div>"; return; }
  closeDialog(); ui.view=null; markSolved(st, true);
}

function startClock(){
  if(ui.timerId) clearInterval(ui.timerId);
  ui.timerId = setInterval(function(){ var c=document.getElementById("clock"); if(c) c.textContent = fmtTime(elapsed()); }, 1000);
}

/* =====================================================================
   MUSIK (nur Beamer-Ansicht) – wird live im Browser erzeugt (Web Audio)
   ===================================================================== */
var Music = (function(){
  /* Version 1.1: lauter, im Frequenzbereich kleiner Lautsprecher (ca. 150 Hz – 5 kHz),
     iOS-Freischaltung (Stummschalter), Pegelmessung für die Anzeige */
  var ctx=null, bus=null, tone=null, hp=null, master=null, analyser=null, crackleGain=null, noiseBuf=null, schedId=null, silentEl=null;
  var mood=null, step=0, nextTime=0, vol=0.8, playing=false, droneUntil=0;
  var LOOKAHEAD = 0.35;
  function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
  var Q = { min:[0,3,7], maj:[0,4,7], dom7:[0,4,7,10], m7:[0,3,7,10] };
  function wrap(n, lo, hi){ while(n<lo) n+=12; while(n>hi) n-=12; return n; }
  function voicing(root, q, lo, hi){ return Q[q].map(function(i){ return wrap(root+i, lo, hi); }).sort(function(a,b){return a-b;}); }

  /* stilles WAV, um auf iPhone/iPad die Wiedergabe trotz Stummschalter zu erlauben */
  function silentURI(){

  document.getElementById("app").innerHTML =
    "<div class='bm' style='--bm-glow:"+glow+"; --bm-accent:"+acc+"'>" +
    "<div class='bm-stage"+(B.showQR?" withqr":"")+"'><div class='bm-side'><div class='bm-help'>Spielzeit</div><div class='bm-time' id='bmTime'>"+fmtTime(bTime())+"</div></div>" +
    "<div class='bm-kicker'>"+esc(ch.kicker)+"</div><div class='bm-title'>"+esc(ch.title)+"</div><div class='bm-text'>"+ch.text.map(function(p){return "<p>"+esc(p)+"</p>";}).join("")+"</div>" +
    (B.showQR ? "<div class='bm-qr'>"+QR.svg(studentURL())+"<div class='bm-url'>"+esc(studentURL())+"</div></div>" : "") +
    "</div>" +
    "<div class='bm-bar' id='bmBar'>" + tabs +
    "<span class='bm-sep'></span>" +
    "<button class='bm-btn' id='bmMusic' aria-pressed='"+Music.isPlaying()+"'>"+(Music.isPlaying()?"⏸ Musik":"▶ Musik")+"</button>" +
    "<span class='bm-status' id='bmStatus'></span>" +
    "<label>Lautstärke <input type='range' id='bmVol' min='0' max='100' value='80'></label>" +
    "<button class='bm-btn' id='bmTimer' aria-pressed='"+B.running+"'>"+(B.running?"⏸ Zeit":"▶ Zeit")+"</button>" +
    "<button class='bm-btn' id='bmReset'>↺ Zeit</button>" +
    "<button class='bm-btn' id='bmQR' aria-pressed='"+B.showQR+"'>QR</button>" +
    "<button class='bm-btn' id='bmFull'>⛶</button>" +
    "<a class='bm-btn' href='"+esc(studentURL())+"' id='bmStudent' style='text-decoration:none;display:inline-flex;align-items:center'>Schüleransicht</a>" +
    "<span class='bm-help'>Tasten: 1–5 Kapitel · M Musik · T Zeit · Q QR · F Vollbild</span>" +
    "</div></div>";
  var vol = document.getElementById("bmVol"); vol.value = Math.round((B.vol==null?0.8:B.vol)*100);
  vol.addEventListener("input", function(){ B.vol = vol.value/100; Music.setVolume(B.vol); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ch]"), function(b){ b.addEventListener("click", function(){ setBeamerChapter(+b.getAttribute("data-ch")); }); });
  on("bmMusic","click",toggleMusic); on("bmTimer","click",toggleTimer); on("bmReset","click",function(){ B.tAcc=0; B.tStart=Date.now(); renderBeamer(); });
  on("bmQR","click",function(){ B.showQR=!B.showQR; renderBeamer(); }); on("bmFull","click",toggleFull);
  wakeBar();
}
function bTime(){ return B.tAcc + (B.running ? Date.now()-B.tStart : 0); }
function setBeamerChapter(i){ if(i<0||i>=CONFIG.beamer.length) return; B.idx=i; Music.switchTo(CONFIG.beamer[i].mood); renderBeamer(); }
function toggleMusic(){
  try{ if(Music.isPlaying()) Music.stop(); else { Music.setVolume(B.vol==null?0.8:B.vol); Music.play(CONFIG.beamer[B.idx].mood); B.musicStart=Date.now(); } }
  catch(e){ alert("Musik kann in diesem Browser nicht abgespielt werden."); }
  renderBeamer();
}
function toggleTimer(){ if(B.running){ B.tAcc += Date.now()-B.tStart; B.running=false; } else { B.tStart=Date.now(); B.running=true; } renderBeamer(); }
function toggleFull(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }catch(e){} }
function wakeBar(){ var b=document.getElementById("bmBar"); if(!b) return; b.classList.remove("dim"); clearTimeout(B.idle); B.idle=setTimeout(function(){ var bb=document.getElementById("bmBar"); if(bb) bb.classList.add("dim"); }, 6000); }
function updateMusicStatus(){
  var el=document.getElementById("bmStatus"); if(!el) return;
  if(!Music.isPlaying()){ el.className="bm-status"; el.innerHTML=""; return; }
  var st=Music.state(), lv=Music.level(), pct=Math.min(100, Math.round(lv*400));
  if(st!=="running"){ el.className="bm-status warn"; el.textContent="⚠ Browser blockiert den Ton – bitte „Musik“ erneut antippen"; return; }
  if(lv<0.002 && Date.now()-(B.musicStart||0)>4000){ el.className="bm-status warn"; el.textContent="⚠ kein Signal – Musik neu starten"; return; }
  el.className="bm-status"; el.innerHTML="♪ <span class='bm-meter' title='Pegel'><i style='width:"+pct+"%'></i></span>";
}
function startBeamer(){
  renderBeamer();
  setInterval(updateMusicStatus, 150);
  ["pointerdown","keydown","touchend"].forEach(function(ev){ document.addEventListener(ev, function(){ if(Music.isPlaying()) Music.resume(); }, true); });
  setInterval(function(){ var t=document.getElementById("bmTime"); if(t) t.textContent=fmtTime(bTime()); }, 500);
  document.addEventListener("mousemove", wakeBar);
  document.addEventListener("keydown", function(e){
    if(e.target && e.target.tagName==="INPUT" && e.target.type!=="range") return;   /* Tasten auch nach Bedienung des Lautstärkereglers */
    if(e.target && e.target.type==="range" && (e.key==="ArrowLeft"||e.key==="ArrowRight")) return; /* Pfeile regeln dort die Lautstärke */
    var k=e.key.toLowerCase();
    if(k>="1" && k<="5") setBeamerChapter(+k-1);
    else if(k==="m") toggleMusic(); else if(k==="t") toggleTimer(); else if(k==="q"){ B.showQR=!B.showQR; renderBeamer(); } else if(k==="f") toggleFull();
    else if(k==="arrowright") setBeamerChapter(B.idx+1); else if(k==="arrowleft") setBeamerChapter(B.idx-1);
  });
}

/* =====================================================================
   START
   ===================================================================== */
if(location.hash.replace("#","").toLowerCase()==="beamer"){ startBeamer(); }
else {
  state = loadState();
  render();
  if(state.phase!=="start") startClock();
}
window.addEventListener("hashchange", function(){ location.reload(); });
</script>
