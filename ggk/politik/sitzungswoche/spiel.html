<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Die Sitzungswoche – Escape Game</title>
<style>
:root{
  --ink:#1b2333; --muted:#4a5568; --bg:#e9edf3; --panel:#ffffff; --line:#cfd6e2;
  --navy:#1f3a68; --navy2:#16294a; --gold:#e2b33c; --gold2:#b88a12;
  --teal:#176f6c; --red:#b3261e; --green:#1e7a34; --purple:#5d3fa8;
  --sel:#1f3a68; --selInk:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Musik in der Schüleransicht (anfangs aus) ----------
   Stationen 1–4: „Die Gedanken sind frei“ (Schleife).
   Ab Station 5 (sobald Station 4 gelöst ist): Nationalhymne in Schleife mit kurzer Pause. */
const MUSIC_SWITCH_AFTER = "s4", HYMN_GAP_SECONDS = 4;
function wantedSong(){ const st = STATIONS.find(x => x.id === MUSIC_SWITCH_AFTER); return st && stationDone(st) ? "hymne" : "gedanken"; }
function updateMusic(){
  if (!S.music){ if (Music.playing) Music.stop(); return; }
  const want = wantedSong();
  if (Music.song !== want) Music.play(want, null, { loop: true, gap: want === "hymne" ? HYMN_GAP_SECONDS : 0 });
}
function renderMusicBtn(){ const b = $("#musicBtn"); if (!b) return; b.setAttribute("aria-pressed", S.music ? "true" : "false"); b.textContent = S.music ? "🔊 Musik" : "🔇 Musik"; b.setAttribute("aria-label", S.music ? "Musik ausschalten" : "Musik einschalten"); }

/* ---------- Kopfleiste ---------- */
#hud{position:sticky;top:0;z-index:20;background:var(--navy2);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
#hud .title{font-weight:800;letter-spacing:.02em;font-size:19px;white-space:nowrap}
#hud .title small{display:block;font-weight:500;font-size:16px;opacity:.8;letter-spacing:0}
#stamps{display:flex;gap:5px}
.stamp{width:36px;height:40px;border:2px dashed rgba(255,255,255,.45);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:rgba(255,255,255,.4);font-family:ui-monospace,Menlo,Consolas,monospace}
.stamp.got{border:2px solid var(--gold);background:var(--gold);color:var(--navy2);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
#hud .stats{display:flex;gap:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;margin-left:auto}
#hud .stats span b{color:var(--gold)}
#menuBtn,#endBtn,#musicBtn{min-height:44px;min-width:44px;border-radius:8px;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;padding:4px 12px;font-weight:700}
#endBtn{border-color:var(--gold);color:var(--gold)}
#musicBtn[aria-pressed="true"]{background:var(--gold);color:var(--navy2);border-color:var(--gold)}

/* ---------- Spielwelt ---------- */
#game{max-width:1100px;margin:0 auto;padding:10px 10px 16px}
#worldWrap{position:relative;margin:0 auto;width:100%;max-width:calc((100vh - 250px) * 1.5556);min-width:300px;border-radius:10px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.25);background:#3b7fd1;touch-action:none}
#world{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.blabel{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border:2px solid var(--navy);border-radius:999px;padding:3px 10px 3px 3px;font-size:18px;font-weight:700;line-height:1.1;min-height:44px;box-shadow:0 2px 4px rgba(0,0,0,.25);white-space:nowrap}
.blabel .num{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;border-radius:999px;background:var(--navy);color:#fff;font-size:20px}
.blabel.locked{opacity:.78;border-color:#7a8496}
.blabel.locked .num{background:#7a8496}
.blabel.done{border-color:var(--green)}
.blabel.done .num{background:var(--green)}
.blabel.next{border-color:var(--gold2);box-shadow:0 0 0 4px rgba(226,179,60,.6)}
.blabel.next .num{background:var(--gold);color:var(--navy2)}
#worldWrap.compact .blabel .nm{display:none}#worldWrap.compact .blabel{padding:3px}
#targetLine{margin:10px auto 0;max-width:900px;text-align:center;font-size:18px}
#targetLine b{color:var(--navy)}

#controls{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:10px;user-select:none;-webkit-user-select:none}
#dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:4px;touch-action:none}
#dpad button{border:none;border-radius:12px;background:var(--navy);color:#fff;font-size:26px;touch-action:none;box-shadow:0 3px 0 var(--navy2)}
#dpad button:active,#dpad button.on{transform:translateY(2px);box-shadow:0 1px 0 var(--navy2);background:#2c5294}
#dpad .c{background:transparent;box-shadow:none;pointer-events:none}
#actBtn{width:110px;height:110px;border-radius:999px;border:none;background:var(--gold);color:var(--navy2);font-weight:800;font-size:20px;box-shadow:0 4px 0 var(--gold2);touch-action:manipulation}
#actBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold2)}
#actBtn.near{animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 4px 0 var(--gold2),0 0 0 0 rgba(226,179,60,.7)}to{box-shadow:0 4px 0 var(--gold2),0 0 0 12px rgba(226,179,60,0)}}
#keysHint{font-size:18px;color:var(--muted);text-align:center;margin-top:6px}
@media (min-width:900px) and (orientation:landscape){
  #game{display:grid;grid-template-columns:minmax(0,1fr) 250px;grid-template-areas:"world ctrl" "line ctrl" "keys ctrl";gap:0 18px;max-width:1500px;align-items:start}
  #worldWrap{grid-area:world;max-width:calc((100vh - 130px) * 1.5556)}
  #targetLine{grid-area:line}
  #keysHint{grid-area:keys}
  #controls{grid-area:ctrl;flex-direction:column;margin-top:0;gap:26px;align-self:center}
}

/* ---------- Dialoge ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,18,34,.62);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;-webkit-overflow-scrolling:touch}
.overlay.top{z-index:60}
.sheet{background:var(--panel);border-radius:14px;max-width:900px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4);overflow:hidden;margin-bottom:24px}
.sheet header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
.sheet header h2{margin:0;font-size:22px;line-height:1.2;flex:1}
.sheet header h2:focus{outline:none}
.sheet header h2 small{display:block;font-size:18px;font-weight:500;opacity:.85}
.xbtn{min-width:44px;min-height:44px;border-radius:8px;border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-size:22px;font-weight:700}
.sheet .body{padding:16px}
@media (max-width:600px){.overlay{padding:0}.sheet{border-radius:0;min-height:100%;margin:0}}
.npc{display:flex;gap:12px;align-items:flex-start;margin:4px 0 16px}
.npc canvas{width:72px;height:72px;image-rendering:pixelated;flex:0 0 72px;border-radius:10px;background:#cfe3f7;border:2px solid var(--navy)}
.bubble{position:relative;background:#f4f1e8;border:2px solid #d8cfb8;border-radius:12px;padding:10px 14px;flex:1}
.bubble .who{font-weight:800;font-size:18px;color:var(--navy);display:block;margin-bottom:2px}
.tag{display:inline-block;font-size:15px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:5px;color:#fff;vertical-align:middle}
.tag.fakt{background:var(--teal)}
.tag.fiktiv{background:var(--purple)}
details.mat{border:2px solid var(--line);border-radius:10px;margin:0 0 10px;background:#fbfcfe}
details.mat>summary{padding:10px 14px;font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:10px;list-style:none}
details.mat>summary::-webkit-details-marker{display:none}
details.mat>summary::before{content:"▸";font-size:18px;color:var(--navy);transition:transform .15s}
details.mat[open]>summary::before{transform:rotate(90deg)}
details.mat .mbody{padding:0 14px 12px}
details.mat .mbody p{margin:.4em 0}
details.mat .mbody ul,details.mat .mbody ol{margin:.4em 0;padding-left:1.3em}
.stand{font-size:18px;color:var(--teal);font-weight:700}
.src{font-size:18px;color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:18px;min-width:560px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:#eef2f8}

.part{border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:16px 0}
.part.solved{border-color:var(--green);background:#f3faf4}
.part-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.part-head h3{margin:0;font-size:20px}
.op{font-size:18px;color:var(--muted);font-weight:600}
.pstate{margin-left:auto;font-weight:800;color:var(--green)}
.prompt{margin:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:18px;background:#f2f5fa;border-radius:8px;padding:8px 10px;margin:6px 0 10px}
.legend b{color:var(--navy)}
ol.items{list-style:none;margin:0;padding:0;counter-reset:it}
ol.items>li{counter-increment:it;border-top:1px solid var(--line);padding:10px 0}
ol.items>li:first-child{border-top:none}
ol.items>li>p{margin:0 0 8px}
ol.items>li>p::before{content:counter(it) ". ";font-weight:800;color:var(--navy)}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.choices+.choices{margin-top:6px}
.ch{min-height:44px;min-width:48px;border:2px solid var(--navy);background:#fff;border-radius:8px;padding:6px 10px;font-size:18px;text-align:left;line-height:1.2}
.ch .k{font-weight:800;margin-right:6px}
.ch[aria-pressed="true"]{background:var(--sel);color:var(--selInk)}
.ch:disabled{cursor:default;opacity:.95}
.q{margin:8px 0 14px}
.q>p{margin:0 0 6px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opts .ch{width:100%}
.order-seq,.order-pool{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.order-seq{min-height:52px;border:2px dashed var(--line);border-radius:10px;padding:6px}
.order-seq .empty{color:var(--muted);padding:8px}
.card{min-height:48px;border:2px solid var(--navy);border-radius:8px;background:#fff;padding:8px 12px;text-align:left;font-size:18px;display:flex;gap:10px;align-items:center;width:100%}
.card .n{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:999px;background:var(--navy);color:#fff;font-weight:800}
.order-seq .card{background:#eef3fb}
.lbl{font-size:18px;font-weight:700;color:var(--muted);margin-top:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.btn{min-height:48px;border-radius:10px;border:none;background:var(--navy);color:#fff;font-weight:800;padding:10px 18px;font-size:18px}
.btn.gold{background:var(--gold);color:var(--navy2)}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.fb{font-weight:700;margin:8px 0 0;min-height:1.4em}
.fb.ok{color:var(--green)}
.fb.no{color:var(--red)}
.hints{border:2px solid #e8d9a8;background:#fffaea;border-radius:12px;padding:10px 14px;margin:16px 0 6px}
.hints.pulse{animation:hp 1s ease 3}
@keyframes hp{50%{box-shadow:0 0 0 6px rgba(226,179,60,.6)}}
.hints h3{margin:0 0 6px;font-size:18px}
.hints ol{margin:4px 0 8px;padding-left:1.3em}
.hints li{margin:4px 0}
.donebox{border:3px solid var(--green);background:#eaf6ec;border-radius:12px;padding:12px 14px;margin:0 0 14px}
.donebox h3{margin:0 0 6px;color:var(--green)}
.donebox .sb{background:#fff;border-left:5px solid var(--gold);padding:8px 10px;margin-top:8px;border-radius:6px}
.infobox{border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;margin:12px 0}
input[type=text]{font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--navy);border-radius:10px;min-height:50px;width:100%;max-width:420px}
label.fl{display:block;font-weight:700;margin:12px 0 4px}
.endcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:44px;font-weight:800;letter-spacing:.12em;color:var(--navy);background:#fff6d8;border:3px solid var(--gold);border-radius:12px;display:inline-block;padding:6px 18px;margin:6px 0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:19px;margin:10px 0}
.facts dt{font-weight:700;color:var(--muted)}
.facts dd{margin:0;font-weight:800}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy2);color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;z-index:80;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.35);text-align:center}
.menu-list{display:flex;flex-direction:column;gap:10px}
.menu-list .btn{text-align:left}

/* ---------- Startbildschirm ---------- */
.hero{text-align:center;padding:6px 0 4px}
.hero h1{font-size:34px;margin:4px 0 2px;color:var(--navy)}
.hero p{margin:4px 0;color:var(--muted)}
.notice{background:#f1edfb;border:2px solid #d6ccef;border-radius:10px;padding:10px 12px;margin:12px 0}

/* ---------- Beamer-Ansicht ---------- */
body.beamer{background:#0f1c33;color:#fff;font-size:22px}
#beamer{max-width:1700px;margin:0 auto;padding:14px 22px;display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
#beamer h1{font-size:46px;margin:0;color:var(--gold);letter-spacing:.02em}
#beamer .sub{font-size:24px;opacity:.85;margin:2px 0 14px}
#beamer .bw{border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#beamer .card2{background:#18294a;border:2px solid #2d4677;border-radius:14px;padding:10px 16px;margin-bottom:12px}
#beamer h2{margin:0 0 6px;font-size:26px;color:var(--gold)}
#beamer ol,#beamer ul{margin:0;padding-left:1.2em}
#beamer li{margin:2px 0}
#bTimer{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:64px;font-weight:800;text-align:center;line-height:1}
#beamer .row .btn{font-size:22px;min-height:56px}
#beamer input[type=range]{width:220px;height:40px}
#bLink{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;word-break:break-all;background:#0b1528;padding:8px 10px;border-radius:8px}
@media (max-width:1000px){#beamer{grid-template-columns:1fr}#beamer h1{font-size:40px}}
</style>
</head>

<script>
"use strict";
/* =====================================================================
   KONFIGURATION – hier stehen alle Texte, Aufgaben, Hinweise und
   Prüfwerte. Texte dürfen Sie hier ändern (HTML ist erlaubt).
   ---------------------------------------------------------------------
   WICHTIG:
   - Die Lösungen stehen NICHT im Klartext hier, sondern nur als
     Prüfwert ("hash"). Wenn Sie die REIHENFOLGE oder den INHALT von
     Aufgaben (items, options, cards) ändern, stimmt der Prüfwert nicht
     mehr. Reine Umformulierungen von Texten sind unproblematisch.
   - Die Infokästen mit "FAKT" geben einen Stand wieder (meta.stand).
     Vor dem Einsatz prüfen und ggf. aktualisieren.
   - Kennzeichnung: tag "FAKT" = reale Information, "FIKTIV" = erfunden.
   ===================================================================== */
const CONFIG = {
  meta: {
    title: "Die Sitzungswoche",
    subtitle: "Escape Game zum politischen System · GGK J1, BPE 2",
    version: "1.3",
    stand: "Ende Oktober 2026",
    storageKey: "sitzungswoche_j1_v1"
  },

  /* Prüfwert des Lehrkraftcodes (Code steht nur im Lehrkraftmaterial) */
  teacherCodeHash: "9743a6a6f8927f15",

  /* Startbildschirm und Einführung */
  start: {
    fiction: "Alle Personen, Parteien, Orte und der Gesetzentwurf in diesem Spiel sind <b>erfunden</b>. Kästen mit dem Etikett <span class=\"tag fakt\">FAKT</span> enthalten echte Informationen.",
    intro: "Hallo, ich bin Konrad Wälder, Fraktionsvorsitzender der Bürgerunion. Schön, dass ihr diese Woche mein Praktikumsteam seid! Ich will ein <b>Bundesgesetz über handyfreie Schulen</b> durch Bundestag und Bundesrat bringen. Dafür brauche ich eure Hilfe an sechs Orten im Regierungsviertel. Für jede gelöste Station bekommt ihr einen Stempel – zusammen ergeben sie ein Lösungswort.",
    controls: "Lauft mit dem Steuerkreuz (oder den Pfeiltasten) zu einer Tür und tippt auf <b>Betreten</b>. Ihr könnt auch einfach auf ein Gebäude tippen – dann läuft eure Figur selbst hin. Die nächste Station ist mit einem gelben Pfeil markiert. Mit dem Knopf <b>Musik</b> oben könnt ihr Musik einschalten – im Unterricht nur, wenn eure Lehrkraft es erlaubt.",
    roles: "Wechselt nach jeder Station die Rollen: <b>Steuerung</b> (iPad), <b>Grundgesetz</b> (Dossier), <b>Akte</b> (Fall vorlesen), <b>Protokoll</b> (Sicherungsblatt)."
  },

  /* ---------------- STATIONEN ---------------- */
  stations: [
    /* ======================= STATION 1 ======================= */
    {
      id: "s1", nr: 1, stamp: "L", name: "Grundgesetz-Pavillon", building: "pav",
      intro: "Bevor wir ein Gesetz schreiben, müsst ihr die Spielregeln kennen. Ohne die Prinzipien des Grundgesetzes läuft hier gar nichts.",
      materials: [
        { title: "M1 – Grundgesetz (Wortlaut)", tag: "FAKT", html:

function windows(c, x, y, w, h, cols, rows, col, ww, wh){

/* ---------- Spielfigur ---------- */
let player = null;
const keys = { up: false, down: false, left: false, right: false };
const MOVE_SPEED = 66;
function makePlayer(pos){ return { x: pos ? pos.x : START.x, y: pos ? pos.y : START.y, dir: "down", flip: false, walk: 0, path: null, then: null }; }
function tryMove(p, dx, dy){
  const box = (x, y) => isSolidPx(x - 5, y - 4) || isSolidPx(x + 5, y - 4) || isSolidPx(x - 5, y) || isSolidPx(x + 5, y);
  let moved = false;
  if (dx && !box(p.x + dx, p.y)){ p.x += dx; moved = true; }
  if (dy && !box(p.x, p.y + dy)){ p.y += dy; moved = true; }
  return moved;
}
function playerTile(p){ return { x: Math.floor(p.x / T), y: Math.floor((p.y - 2) / T) }; }
function bfs(from, to){
  const key = (x, y) => y * MW + x, prev = new Map(), q = [from]; prev.set(key(from.x, from.y), null);
  while (q.length){
    const cur = q.shift();
    if (cur.x === to.x && cur.y === to.y){ const out = []; let k = key(cur.x, cur.y); while (k != null){ out.unshift({ x: k % MW, y: Math.floor(k / MW) }); k = prev.get(k); } return out; }
    for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = cur.x + ax, ny = cur.y + ay;
      if (nx < 0 || ny < 0 || nx >= MW || ny >= MH || solid[ny][nx] || prev.has(key(nx, ny))) continue;
      prev.set(key(nx, ny), key(cur.x, cur.y)); q.push({ x: nx, y: ny });
    }
  }
  return null;
}
function walkTo(p, bid, then){
  const b = BMAP[bid]; let start = playerTile(p);
  if (solid[start.y] && solid[start.y][start.x]) start = { x: Math.floor(p.x / T), y: Math.floor(p.y / T) };
  const path = bfs(start, b.front);
  if (!path){ p.path = null; return false; }
  p.path = path.map(t => ({ x: t.x * T + 8, y: t.y * T + 11 })); p.then = then || null; return true;
}
function stepPlayer(p, dt){
  let vx = 0, vy = 0;
  if (p === player && !modalOpen()){
    if (keys.left) vx -= 1; if (keys.right) vx += 1; if (keys.up) vy -= 1; if (keys.down) vy += 1;
  }
  if (vx || vy){ p.path = null; p.then = null; }
  if (!vx && !vy && p.path && p.path.length){
    const wp = p.path[0], ddx = wp.x - p.x, ddy = wp.y - p.y, d = Math.hypot(ddx, ddy);
    if (d < 1.5){ p.x = wp.x; p.y = wp.y; p.path.shift(); if (!p.path.length){ p.path = null; const t = p.then; p.then = null; p.walk = 0; if (t) t(); return; } }
    else { vx = ddx / d; vy = ddy / d; }
    if (vx || vy){ p.x += vx * MOVE_SPEED * dt; p.y += vy * MOVE_SPEED * dt; setDir(p, vx, vy); p.walk += dt; return; }
  }
  if (vx || vy){
    const n = Math.hypot(vx, vy); vx /= n; vy /= n;
    const mv = tryMove(p, vx * MOVE_SPEED * dt, vy * MOVE_SPEED * dt);
    setDir(p, vx, vy); p.walk = mv ? p.walk + dt : 0;
  } else p.walk = 0;
}
function setDir(p, vx, vy){ if (Math.abs(vy) > Math.abs(vx)) p.dir = vy < 0 ? "up" : "down"; else { p.dir = "down"; p.flip = vx < 0; } }
function drawPlayer(c, p){
  const frame = Math.floor(p.walk * 8) % 2;
  const rows = p.dir === "up" ? (frame ? PL_UP2 : PL_UP) : (frame ? PL_DOWN2 : PL_DOWN);
  const bob = frame && p.walk ? -1 : 0;
  R(c, Math.round(p.x) - 5, Math.round(p.y) - 1, 10, 3, "rgba(0,0,0,.28)");
  drawPixels(c, rows, PL_PAL, Math.round(p.x) - 6, Math.round(p.y) - 15 + bob, 1, p.flip);
}
function nearBuilding(p){
  let best = null, bd = 21;
  BUILDINGS.forEach(b => { const fx = b.front.x * T + 8, fy = b.front.y * T + 11, d = Math.hypot(p.x - fx, p.y - fy); if (d < bd){ bd = d; best = b; } });
  return best;
}

/* ---------- Rendern ---------- */
let bgCanvas = null;
function renderBackground(){
  bgCanvas = document.createElement("canvas"); bgCanvas.width = MW * T; bgCanvas.height = MH * T;
  const c = bgCanvas.getContext("2d");
  drawGround(c); TREES.forEach(([x, y]) => drawTree(c, x, y)); BUILDINGS.forEach(b => drawBuilding(c, b));
}
function drawArrow(c, bid, t){
  const b = BMAP[bid]; if (!b) return;
  const x = b.front.x * T + 8, y = (b.front.y < b.y ? b.y * T - 3 : b.front.y * T - 8) + Math.round(Math.sin(t * 5) * 2);
  const rows = ["ooooooooo", "oyyyyyyyo", ".oyyyyyo.", "..oyyyo..", "...oyo...", "....o...."];
  drawPixels(c, rows, { o: "#3b2a00", y: "#ffd84a" }, x - 4, y - 6, 1);
}
let lastT = 0, worldCtx = null, rafId = 0;
function frame(ts){
  const t = ts / 1000, dt = Math.min(0.05, lastT ? t - lastT : 0); lastT = t;
  if (player){ stepPlayer(player, dt); }
  const c = worldCtx; c.imageSmoothingEnabled = false;
  c.drawImage(bgCanvas, 0, 0);
  const nt = nextTarget(); if (nt) drawArrow(c, nt.bid, t);
  if (player) drawPlayer(c, player);
  if (player){ const nb = nearBuilding(player); $("#actBtn").classList.toggle("near", !!nb && !modalOpen()); }
  if (S.start){ $("#hudTime").textContent = fmtTime((S.finish || Date.now()) - S.start); }
  rafId = requestAnimationFrame(frame);
}

function renderLabels(){

    const info = buildingInfo(b.id); if (!info) return;
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "blabel"; btn.dataset.b = b.id;
    const SHORT = { pav: "Grundgesetz", pz: "Parteizentrale", fs: "Fraktionssaal", rh: "Rathaus", vh: "Verbändehaus", bt: "Bundestag", zus: "Karlsruhe", br: "Bundesrat", aus: "Ausgang" };
    const nm = SHORT[b.id] || b.name, nr = info.nr;

    if (nt && nt.bid === b.id) btn.classList.add("next");

    btn.setAttribute("aria-label", (info.kind === "st" ? "Station " + nr + ": " : "") + nm + (info.done ? ", gelöst" : info.locked ? ", noch geschlossen" : ", offen") + ". Hinlaufen");
    btn.style.left = ((b.x + b.w / 2) / MW * 100) + "%";
    btn.style.top = ((b.y + b.h * (b.front.y < b.y ? 0.68 : 0.36)) / MH * 100) + "%";
    btn.addEventListener("click", () => { if (!player) return; if (!walkTo(player, b.id, () => openBuilding(b.id))) openBuilding(b.id); });
    host.appendChild(btn);
  });
  $("#targetLine").innerHTML = nt ? "Nächstes Ziel: <b>" + esc(nt.text) + "</b>" : "Alles erledigt – großartig!";
}

let modal = null, modal2 = null;

  const body = $(".body", root);
  if (typeof opts.body === "string") body.innerHTML = opts.body; else if (opts.body) body.appendChild(opts.body);
  const x = $("[data-close]", root); if (x) x.addEventListener("click", () => (root.id === "modalRoot2" ? closeModal2() : closeModal()));
  setTimeout(() => { const h = $("#" + root.id + "H"); if (h) h.focus({ preventScroll: true }); }, 30);
  return body;
}
function openModal(opts){ modal = opts; Object.keys(keys).forEach(k => keys[k] = false); return showSheet($("#modalRoot"), opts); }
function closeModal(){ if (modal && modal.onClose) modal.onClose(); modal = null; $("#modalRoot").innerHTML = ""; refreshWorld(); const a = $("#actBtn"); if (a) a.focus({ preventScroll: true }); }
function openModal2(opts){ modal2 = opts; return showSheet($("#modalRoot2"), opts); }

let toastTimer = 0;
function toast(msg, ms){ const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), ms || 3200); }
function npc(html){ const wrap = document.createElement("div"); wrap.className = "npc"; wrap.appendChild(portrait()); const b = document.createElement("div"); b.className = "bubble"; b.innerHTML = '<span class="who">Konrad Wälder (fiktiv)</span>' + html; wrap.appendChild(b); return wrap; }

/* ---------- Gebäude betreten ---------- */
function openBuilding(bid){
  const info = buildingInfo(bid); if (!info) return;
  if (info.locked){
    const nt = nextTarget();
    toast("Noch geschlossen. " + (nt ? "Als Nächstes: " + nt.text + "." : ""));
    return;
  }
  if (info.kind === "fin"){ if (S.finish) showEnd(); else openFinale(); return; }
  if (info.kind === "zus"){ openStation(CONFIG.zusatz, "zus"); return; }
  openStation(info.st, bid);
}

/* ---------- Station ---------- */
function openStation(st, bid){
  const isZ = st === CONFIG.zusatz;
  const title = (isZ ? "Zusatzstation" : "Station " + st.nr) + " · " + esc(st.name) + (st.id === "s6" ? "<small>" + (bid === "bt" ? "Im Bundestag (Teil A)" : "Im Bundesrat (Teile B und C)") + "</small>" : "");
  const body = openModal({ title, kind: "station", st, bid });
  renderStationBody(body, st, bid);
}
function renderStationBody(body, st, bid){
  body.innerHTML = "";
  const parts = st.parts.filter(p => partBuilding(st, p) === bid);
  if (stationDone(st)) body.appendChild(doneBox(st));
  else if (parts.every(p => isSolved(p.id))){
    const rest = st.parts.find(p => !isSolved(p.id));
    const box = document.createElement("div"); box.className = "donebox";
    box.innerHTML = "<h3>Hier ist alles erledigt!</h3><p>Weiter geht es im <b>" + esc(BMAP[partBuilding(st, rest)].name) + "</b>.</p>";
    const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = "Zurück zur Karte"; b.addEventListener("click", closeModal); box.appendChild(b);
    body.appendChild(box);
  }
  const intro = typeof st.intro === "object" ? st.intro[bid] : st.intro;
  body.appendChild(npc(intro));
  (st.materials || []).filter(m => !m.building || m.building === bid).forEach(m => {
    const d = document.createElement("details"); d.className = "mat"; d.open = true;

/* ---------- Teilaufgaben ---------- */
function getSel(p){
  if (!S.sel[p.id]){
    if (p.type === "assign") S.sel[p.id] = p.items.map(() => p.dims.map(() => null));
    else if (p.type === "quiz") S.sel[p.id] = p.questions.map(q => q.multi ? [] : null);
    else if (p.type === "order") S.sel[p.id] = [];
  }
  return S.sel[p.id];
}
function answerString(p){
  const sel = getSel(p);
  if (p.type === "assign"){ if (sel.some(r => r.some(v => v == null))) return null; return sel.map(r => r.join("")).join(","); }
  if (p.type === "quiz"){
    for (let i = 0; i < p.questions.length; i++){ const q = p.questions[i], v = sel[i]; if (q.multi ? !v.length : v == null) return null; if (q.exact && v.length !== q.exact) return "EXACT:" + q.exact; }
    return sel.map((v, i) => p.questions[i].multi ? v.slice().sort().join("+") : v).join("|");
  }
  if (p.type === "order"){ if (sel.length !== p.cards.length) return null; return sel.join(","); }
  return null;
}
function renderPart(p){
  const solved = isSolved(p.id), sel = getSel(p);
  const wrap = document.createElement("section"); wrap.className = "part" + (solved ? " solved" : ""); wrap.id = "part-" + p.id;
  wrap.innerHTML = '<div class="part-head"><h3>' + esc(p.title) + '</h3><span class="op">' + esc(p.operator) + '</span><span class="pstate">' + (solved ? (S.teacher[p.id] ? "✓ freigeschaltet" : "✓ gelöst") : "") + '</span></div><p class="prompt">' + p.prompt + '</p>';
  const rerender = () => { const n = renderPart(p); wrap.replaceWith(n); };
  if (p.type === "assign"){
    const lg = document.createElement("div"); lg.className = "legend";
    lg.innerHTML = p.dims.map(d => d.map(o => "<span><b>" + esc(o.k === "-" ? "–" : o.k) + "</b> = " + esc(o.l) + "</span>").join("")).join("");
    wrap.appendChild(lg);
    const ol = document.createElement("ol"); ol.className = "items";
    p.items.forEach((it, i) => {
      const li = document.createElement("li"); li.innerHTML = "<p>" + it + "</p>";
      p.dims.forEach((d, di) => {
        const g = document.createElement("div"); g.className = "choices"; g.setAttribute("role", "group"); g.setAttribute("aria-label", "Aussage " + (i + 1) + (p.dims.length > 1 ? (di ? ": Richtung" : ": Kriterium") : ""));
        d.forEach(o => {
          const b = document.createElement("button"); b.type = "button"; b.className = "ch"; b.disabled = solved;
          const short = d.length > 2 || p.dims.length > 1 ? o.l : o.l;
          b.innerHTML = '<span class="k">' + esc(o.k === "-" ? "–" : o.k) + "</span>" + '<span class="t">' + esc(short) + "</span>";
          b.setAttribute("aria-pressed", sel[i][di] === o.k ? "true" : "false");
          b.setAttribute("aria-label", o.l);
          b.addEventListener("click", () => { sel[i][di] = o.k; save(); $$("button", g).forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); });
          g.appendChild(b);
        });
        li.appendChild(g);
      });
      ol.appendChild(li);
    });
    wrap.appendChild(ol);
  } else if (p.type === "quiz"){
    p.questions.forEach((q, qi) => {
      const box = document.createElement("div"); box.className = "q"; box.innerHTML = "<p>" + q.q + "</p>";
      const opts = document.createElement("div"); opts.className = "opts"; opts.setAttribute("role", "group");
      q.options.forEach(o => {
        const b = document.createElement("button"); b.type = "button"; b.className = "ch"; b.disabled = solved;
        const on = q.multi ? sel[qi].includes(o.k) : sel[qi] === o.k;
        b.setAttribute("aria-pressed", on ? "true" : "false");
        b.innerHTML = (q.multi ? '<span class="k" aria-hidden="true">' + (on ? "☑" : "☐") + "</span>" : '<span class="k">' + esc(o.k) + ")</span>") + esc(o.l);
        b.addEventListener("click", () => {
          if (q.multi){ const a = sel[qi], ix = a.indexOf(o.k); if (ix >= 0) a.splice(ix, 1); else a.push(o.k); }
          else sel[qi] = o.k;
          save(); rerender();
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); wrap.appendChild(box);
    });
  } else if (p.type === "order"){
    const lab1 = document.createElement("div"); lab1.className = "lbl"; lab1.textContent = "Eure Reihenfolge:"; wrap.appendChild(lab1);
    const seq = document.createElement("div"); seq.className = "order-seq";
    if (!sel.length) seq.innerHTML = '<div class="empty">Noch leer – tippt unten die erste Karte an.</div>';
    sel.forEach((k, i) => {
      const c = p.cards.find(x => x.k === k);
      const b = document.createElement("button"); b.type = "button"; b.className = "card"; b.disabled = solved;
      b.innerHTML = '<span class="n">' + (i + 1) + "</span><span>" + esc(c.l) + "</span>";
      b.setAttribute("aria-label", "Platz " + (i + 1) + ": " + c.l + ". Antippen zum Herausnehmen");
      b.addEventListener("click", () => { sel.splice(i, 1); save(); rerender(); });
      seq.appendChild(b);
    });
    wrap.appendChild(seq);
    const rest = p.cards.filter(c => !sel.includes(c.k));
    if (rest.length && !solved){
      const lab2 = document.createElement("div"); lab2.className = "lbl"; lab2.textContent = "Karten:"; wrap.appendChild(lab2);
      const pool = document.createElement("div"); pool.className = "order-pool";
      rest.forEach(c => {
        const b = document.createElement("button"); b.type = "button"; b.className = "card"; b.innerHTML = '<span class="n">+</span><span>' + esc(c.l) + "</span>";
        b.setAttribute("aria-label", c.l + ". Antippen zum Einordnen");
        b.addEventListener("click", () => { sel.push(c.k); save(); rerender(); });
        pool.appendChild(b);
      });
      wrap.appendChild(pool);
    }
    if (sel.length && !solved){ const r = document.createElement("button"); r.type = "button"; r.className = "btn ghost"; r.style.marginTop = "6px"; r.textContent = "Reihenfolge leeren"; r.addEventListener("click", () => { sel.length = 0; save(); rerender(); }); wrap.appendChild(r); }
  }
  const row = document.createElement("div"); row.className = "row";
  const fb = document.createElement("p"); fb.className = "fb"; fb.setAttribute("aria-live", "polite");
  if (!solved){
    const chk = document.createElement("button"); chk.type = "button"; chk.className = "btn gold"; chk.textContent = "Prüfen";
    chk.addEventListener("click", () => checkPart(p, fb));
    row.appendChild(chk); wrap.appendChild(row);
  } else { fb.className = "fb ok"; fb.textContent = S.teacher[p.id] ? "Von der Lehrkraft freigeschaltet." : "Richtig gelöst!"; }
  wrap.appendChild(fb);
  return wrap;
}
function checkPart(p, fb){
  const ans = answerString(p);
  if (ans == null){ fb.className = "fb no"; fb.textContent = p.type === "order" ? "Ordnet zuerst alle Karten ein." : p.type === "quiz" ? "Beantwortet zuerst alle Fragen." : "Ordnet zuerst alle Aussagen zu."; return; }
  if (ans.indexOf("EXACT:") === 0){ fb.className = "fb no"; fb.textContent = "Wählt bei der zweiten Frage genau " + ans.slice(6) + " Argumente."; return; }
  if (hashHex(p.id + "|" + ans) === p.hash){ solvePart(p, false); return; }
  S.wrong[p.id] = (S.wrong[p.id] || 0) + 1; save();
  fb.className = "fb no";
  fb.textContent = "Noch nicht richtig. Mindestens eine Antwort stimmt nicht." + (S.wrong[p.id] >= 3 ? " Tipp: Holt euch unten einen Hinweis." : "");
  if (S.wrong[p.id] >= 3){ const hb = $("#hints-" + p._st.id); if (hb){ hb.classList.remove("pulse"); void hb.offsetWidth; hb.classList.add("pulse"); } }
}
function solvePart(p, byTeacher){
  const st = p._st, wasDone = stationDone(st);
  S.solved[p.id] = true; if (byTeacher) S.teacher[p.id] = true; save();
  renderHud();
  if (modal && modal.kind === "station" && modal.st === st){ renderStationBody($("#modalRoot .body"), st, modal.bid); }
  if (!wasDone && stationDone(st)){
    $("#modalRoot .body") && $("#modalRoot .body").scrollTo ? ($("#modalRoot .overlay").scrollTop = 0) : 0;
    if (STATIONS.includes(st)) toast("Stempel „" + st.stamp + "“ erhalten!");
  } else if (!byTeacher) toast("Richtig!");
  updateMusic();
  if (p.afterSolve && !S.twist){ S.twist = true; save(); setTimeout(() => showTwist(p.afterSolve), 350); }
}

    const raw = $("#finIn").value, fb = $("#finFb");

    /* Varianten ohne Umlaut-Schreibung zulassen (a→ae, o→oe, u→ue an je einer Stelle) */

    if (cands.some(x => hashHex("fin|" + x) === f.hash)){
      S.finish = Date.now(); S.finishHints = totalHints(); save(); closeModal(); showEnd(true);
    } else { S.wrong.fin = (S.wrong.fin || 0) + 1; save(); fb.className = "fb no"; fb.textContent = "Das ist es noch nicht." + (S.wrong.fin >= 3 ? " Tipp: Schaut euch die Hinweise an." : ""); }

const KEYMAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
function action(){
  if (!player || modalOpen()) return;
  const nb = nearBuilding(player);
  if (nb) openBuilding(nb.id); else toast("Geht zu einer Tür oder tippt auf ein Gebäude.");
}
function bindInputs(){
  document.addEventListener("keydown", e => {
    if (e.key === "Escape"){ if (modal2) closeModal2(); else if (modal && modal.closable !== false && modal.kind !== "start") closeModal(); return; }
    if (modalOpen()) return;
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT") return;
    const d = KEYMAP[e.code]; if (d){ keys[d] = true; e.preventDefault(); return; }
    if ((e.code === "Space" || e.code === "Enter" || e.code === "KeyE") && !(tag === "BUTTON" && e.code !== "KeyE")){ e.preventDefault(); action(); }
  });
  document.addEventListener("keyup", e => { const d = KEYMAP[e.code]; if (d) keys[d] = false; });
  window.addEventListener("blur", () => Object.keys(keys).forEach(k => keys[k] = false));
  $$("#dpad button").forEach(b => {
    const d = b.dataset.dir;
    const on = e => { e.preventDefault(); keys[d] = true; b.classList.add("on"); try { b.setPointerCapture(e.pointerId); } catch(_){} };
    const off = () => { keys[d] = false; b.classList.remove("on"); };
    b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off); b.addEventListener("pointercancel", off); b.addEventListener("lostpointercapture", off);
    b.addEventListener("contextmenu", e => e.preventDefault());
  });
  $("#actBtn").addEventListener("click", action);
  $("#menuBtn").addEventListener("click", openMenu);
  $("#musicBtn").addEventListener("click", () => { S.music = !S.music; save(); renderMusicBtn(); updateMusic(); if (S.music && !Music.playing) toast("Dieser Browser kann keine Musik abspielen."); });
  $("#endBtn").addEventListener("click", () => showEnd(false));
  /* Tippen direkt auf die Karte: zum nächstgelegenen Gebäude laufen */
  $("#world").addEventListener("click", e => {
    if (!player || modalOpen()) return;
    const r = e.target.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * MW, y = (e.clientY - r.top) / r.height * MH;
    const b = BUILDINGS.find(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h);
    if (b){ if (!walkTo(player, b.id, () => openBuilding(b.id))) openBuilding(b.id); }
  });
}

/* =====================================================================
   BEAMER-ANSICHT (nur für die Lehrkraft) – mit Musik
   ===================================================================== */
const Music = (() => {
  /* Musik nur für die Beamer-Ansicht, im Browser erzeugt (keine Audiodateien).
     1) „Die Gedanken sind frei“ – Volkslied um 1800, gemeinfrei; eigene Chiptune-Fassung, läuft in Schleife.
     2) Nationalhymne – Melodie: Joseph Haydn (1797), gemeinfrei; schlichte Fassung, wird einmal gespielt.
     Notenquellen: Essener Volksliedsammlung (via music21) bzw. Notensatz „Das Lied der Deutschen“ (LilyPond, Wiki Jurtenland), abgeglichen mit dem Melodie-Incipit „Austrian Hymn“ (Hymnary.org). */
  const PC = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
  function midi(n){ const m = /^([A-G])(b|#)?(\d)$/.exec(n); return (parseInt(m[3], 10) + 1) * 12 + PC[m[1]] + (m[2] === "b" ? -1 : m[2] === "#" ? 1 : 0); }
  const hz = (n, tr) => 440 * Math.pow(2, (midi(n) + (tr || 0) - 69) / 12);

  /* --- Die Gedanken sind frei (C-Dur, 3/4, Auftakt) --- */
  const GED_MEL = [["G4",.5],["G4",.5],
    ["C5",1],["C5",1],["E5",.5],["C5",.5], ["G4",2],["G4",1], ["F4",1],["D4",1],["G4",1], ["E4",1],["C4",1],["G4",1],
    ["C5",1],["C5",1],["E5",.5],["C5",.5], ["G4",2],["G4",1], ["F4",1],["D4",1],["G4",1], ["E4",1],["C4",1],["C5",1],
    ["B4",1],["D5",1.5],["B4",.5], ["C5",1],["E5",1],["C5",1], ["B4",1],["D5",1.5],["B4",.5], ["C5",1],["E5",1],["C5",1],
    ["A4",1],["A4",1],["C5",.5],["A4",.5], ["G4",2],["G4",.5],["E5",.5], ["E5",.5],["D5",.5],["C5",1],["B4",1], ["C5",2]];
  const GED_CH = ["C","C","G7","C","C","C","G7","C","G","C","G","C","F","C","G7","C"];
  const CH = { C: ["C3", ["E3","G3"]], G: ["G2", ["B2","D3"]], G7: ["G2", ["B2","F3"]], F: ["F2", ["A2","C3"]] };
  function gedBass(){
    const ev = [];
    GED_CH.forEach((c, i) => { const start = 1 + i * 3, len = i === GED_CH.length - 1 ? 2 : 3, [root, dy] = CH[c];
      ev.push([root, start, 0.9, 0.30]);
      for (let b = 1; b < len; b++) dy.forEach(n => ev.push([n, start + b, 0.45, 0.07]));
    });
    return ev;
  }
  /* --- Nationalhymne (Es-Dur, 4/4) --- */
  const H1 = [["Eb4",1.5],["F4",.5],["G4",1],["F4",1], ["Ab4",1],["G4",1],["F4",.5],["D4",.5],["Eb4",1], ["C5",1],["Bb4",1],["Ab4",1],["G4",1], ["F4",1],["G4",.5],["Eb4",.5],["Bb4",2]];
  /* Abschnitte nach dem Notensatz: A (Z. 1–2) zweimal, B (Z. 5–6) einmal, C (Z. 7–8) zweimal */
  const H2 = [["F4",1],["G4",1],["F4",.5],["D4",.5],["Bb3",1], ["Ab4",1],["G4",1],["F4",.5],["D4",.5],["Bb3",1],
    ["Bb4",1],["Ab4",1],["G4",1.5],["G4",.5], ["A4",1],["A4",.5],["Bb4",.5],["Bb4",2]];
  const H3 = [["Eb5",1.5],["D5",.5],["D5",.5],["C5",.5],["Bb4",1], ["C5",1.5],["Bb4",.5],["Bb4",.5],["Ab4",.5],["G4",1],
    ["F4",1.5],["G4",.25],["Ab4",.25],["Bb4",.5],["C5",.5],["Ab4",.5],["F4",.5], ["Eb4",1],["G4",.5],["F4",.5],["Eb4",2]];
  const HYM_MEL = H1.concat(H1, H2, H3, H3);
  const HB1 = [["Eb3",1.5],["Eb3",.5],["Eb3",1],["Bb2",1], ["D3",1],["Eb3",1],["Bb2",1],["Eb3",1], ["Ab3",1],["G3",1],["D3",1],["Eb3",1], ["Ab2",1],["A2",1],["Bb2",2]];
  const HB2 = [["Bb2",1],["Bb2",1],["Bb2",1],["Bb2",1], ["Bb2",1],["Bb2",1],["Bb2",1],["Bb2",1],
    ["G2",1],["Ab2",.5],["Bb2",.5],["C3",1.5],["C3",.5], ["F3",1.5],["F2",.5],["Bb2",2]];
  const HB3 = [["G3",1.5],["G3",.5],["Ab3",1],["Eb3",1], ["Ab3",1.5],["G3",.5],["F3",1],["Eb3",1],
    ["Bb2",1],["Ab2",1],["G2",1],["Ab2",1], ["Bb2",1],["Bb2",1],["Eb2",2]];
  const HYM_BASS = HB1.concat(HB1, HB2, HB3, HB3);
  const seq = list => { let t = 0; return list.map(([n, d]) => { const e = [n, t, d]; t += d; return e; }); };
  const total = list => list.reduce((s, x) => s + x[1], 0);

  const SONGS = {
    gedanken: { bpm: 112, tr: 2, loop: true, beats: total(GED_MEL),
      voices: () => [ { wave: "pulse", g: 0.34, ev: seq(GED_MEL) }, { wave: "square", g: 0.02, oct: 12, ev: seq(GED_MEL), short: true }, { wave: "triangle", ev: gedBass() } ] },
    hymne: { bpm: 74, tr: 0, loop: false, beats: total(HYM_MEL),
      voices: () => [ { wave: "square", g: 0.10, ev: seq(HYM_MEL), legato: true }, { wave: "triangle", g: 0.12, oct: -12, ev: seq(HYM_MEL), legato: true }, { wave: "triangle", g: 0.30, ev: seq(HYM_BASS), legato: true } ] }
  };

  let ctx = null, master = null, pulse = null, timer = 0, endTimer = 0, nextLoop = 0, current = null, vol = 0.5, onEnd = null, looping = false, gap = 0;
  function ensure(){
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ctx = new AC(); newMaster();
    const n = 32, re = new Float32Array(n), im = new Float32Array(n); for (let i = 1; i < n; i++){ im[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * 0.25); }
    pulse = ctx.createPeriodicWave(re, im); return true;
  }
  let probe = null;
  function newMaster(){ master = ctx.createGain(); master.gain.value = vol * 0.35; master.connect(ctx.destination); if (!probe){ probe = ctx.createAnalyser(); probe.fftSize = 2048; } master.connect(probe); }
  function tone(wave, f, t0, dur, g, legato){
    const o = ctx.createOscillator(), a = ctx.createGain();
    if (wave === "pulse") o.setPeriodicWave(pulse); else o.type = wave;
    o.frequency.value = f;
    const att = legato ? 0.04 : 0.01, hold = legato ? 0.85 : 0.7, rel = legato ? 0.98 : 0.95;
    a.gain.setValueAtTime(0, t0); a.gain.linearRampToValueAtTime(g, t0 + att); a.gain.setValueAtTime(g, t0 + dur * hold); a.gain.linearRampToValueAtTime(0, t0 + dur * rel);
    o.connect(a); a.connect(master); o.start(t0); o.stop(t0 + dur);
  }
  function schedule(song, t0){
    const B = 60 / song.bpm;
    song.voices().forEach(v => v.ev.forEach(e => {
      const [n, t, d, g] = e;
      tone(v.wave, hz(n, song.tr + (v.oct || 0)), t0 + t * B, (v.short ? d * 0.5 : d) * B, g != null && v.g == null ? g : v.g, v.legato);
    }));
    return song.beats * B;
  }
  function tick(){ if (!current || !looping) return; while (nextLoop < ctx.currentTime + 1.5){ nextLoop += schedule(current, nextLoop) + gap; } }
  function stop(){
    clearInterval(timer); clearTimeout(endTimer); current = null;
    if (ctx){ try { master.disconnect(); } catch(e){} newMaster(); }
  }
  return {
    /* opts.loop: auch ein sonst einmaliges Stück wiederholen; opts.gap: Pause zwischen Durchläufen (Sekunden) */
    play(name, done, opts){
      if (!ensure()) return false;
      if (ctx.state === "suspended") ctx.resume();
      stop(); current = SONGS[name]; onEnd = done || null;
      looping = current.loop || !!(opts && opts.loop); gap = (opts && opts.gap) || 0;
      const t0 = ctx.currentTime + 0.1;
      if (looping){ nextLoop = t0; tick(); timer = setInterval(tick, 300); }
      else { const len = schedule(current, t0); endTimer = setTimeout(() => { current = null; if (onEnd) onEnd(); }, (len + 0.4) * 1000); }
      return true;
    },
    stop,
    setVolume(v){ vol = v; if (master) master.gain.value = v * 0.35; },
    get playing(){ return !!current; },
    get looping(){ return !!current && looping; },
    get song(){ return current === SONGS.gedanken ? "gedanken" : current === SONGS.hymne ? "hymne" : null; },
    /* Pegel des Ausgangs (für den automatischen Test, ob wirklich Ton entsteht) */
    _level(){ if (!probe) return 0; const a = new Float32Array(probe.fftSize); probe.getFloatTimeDomainData(a); let q = 0; for (let i = 0; i < a.length; i++) q += a[i] * a[i]; return Math.sqrt(q / a.length); },
    _beats: () => ({ gedanken: SONGS.gedanken.beats, hymne: SONGS.hymne.beats, hymneBass: total(HYM_BASS) })
  };
})();

/* =====================================================================
   QR-CODE (Byte-Modus, Fehlerkorrektur M) – damit die iPads die Adresse scannen können
   (übernommen aus „Akte Weimar“)
   ===================================================================== */
var QR = (function(){
  var ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26], BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16];
  function rawModules(v){ var r=(16*v+128)*v+64; if(v>=2){ var na=Math.floor(v/7)+2; r-=(25*na-10)*na-55; if(v>=7) r-=36; } return r; }
  function dataCw(v){ return Math.floor(rawModules(v)/8) - ECC[v]*BLK[v]; }
  function gmul(x,y){ var z=0; for(var i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z&255; }
  function rsDiv(deg){ var r=[]; for(var i=0;i<deg;i++) r.push(0); r[deg-1]=1; var root=1; for(i=0;i<deg;i++){ for(var j=0;j<r.length;j++){ r[j]=gmul(r[j],root); if(j+1<r.length) r[j]^=r[j+1]; } root=gmul(root,2); } return r; }
  function rsRem(data,div){ var r=div.map(function(){return 0;}); data.forEach(function(b){ var f=b^r.shift(); r.push(0); div.forEach(function(c,i){ r[i]^=gmul(c,f); }); }); return r; }
  function utf8(s){ var b=[]; var e=unescape(encodeURIComponent(s)); for(var i=0;i<e.length;i++) b.push(e.charCodeAt(i)); return b; }
  function make(text){
    var data=utf8(text), v;
    for(v=1; v<=20; v++){ if(4+(v<10?8:16)+data.length*8 <= dataCw(v)*8) break; }
    if(v>20) return null;
    var bits=[]; function put(val,len){ for(var i=len-1;i>=0;i--) bits.push((val>>>i)&1); }
    put(4,4); put(data.length, v<10?8:16); data.forEach(function(b){ put(b,8); });
    var cap=dataCw(v)*8; put(0, Math.min(4, cap-bits.length)); while(bits.length%8) bits.push(0);
    var bytes=[]; for(var i=0;i<bits.length;i+=8){ var x=0; for(var j=0;j<8;j++) x=(x<<1)|bits[i+j]; bytes.push(x); }
    for(var p=0xEC; bytes.length<dataCw(v); p^=0xEC^0x11) bytes.push(p);
    /* Blöcke + Fehlerkorrektur, verschränkt */
    var nb=BLK[v], el=ECC[v], raw=Math.floor(rawModules(v)/8), nShort=nb-raw%nb, shortLen=Math.floor(raw/nb), blocks=[], div=rsDiv(el), k=0;
    for(i=0;i<nb;i++){ var dat=bytes.slice(k, k+shortLen-el+(i<nShort?0:1)); k+=dat.length; var ec=rsRem(dat,div); if(i<nShort) dat.push(0); blocks.push(dat.concat(ec)); }
    var cw=[]; for(i=0;i<blocks[0].length;i++) for(j=0;j<blocks.length;j++) if(i!==shortLen-el || j>=nShort) cw.push(blocks[j][i]);
    /* Matrix */
    var size=v*4+17, M=[], F=[]; for(i=0;i<size;i++){ M.push(new Array(size).fill(false)); F.push(new Array(size).fill(false)); }
    function sf(x,y,d){ M[y][x]=d; F[y][x]=true; }
    for(i=0;i<size;i++){ sf(6,i,i%2===0); sf(i,6,i%2===0); }
    [[3,3],[size-4,3],[3,size-4]].forEach(function(c){ for(var dy=-4;dy<=4;dy++) for(var dx=-4;dx<=4;dx++){ var d=Math.max(Math.abs(dx),Math.abs(dy)), xx=c[0]+dx, yy=c[1]+dy; if(xx>=0&&xx<size&&yy>=0&&yy<size) sf(xx,yy,d!==2&&d!==4); } });
    var al=[]; if(v>1){ var na=Math.floor(v/7)+2, stp=Math.ceil((v*4+4)/(na*2-2))*2; al=[6]; for(var pos=size-7; al.length<na; pos-=stp) al.splice(1,0,pos); }
    for(i=0;i<al.length;i++) for(j=0;j<al.length;j++){ if((i===0&&j===0)||(i===0&&j===al.length-1)||(i===al.length-1&&j===0)) continue; for(var dy2=-2;dy2<=2;dy2++) for(var dx2=-2;dx2<=2;dx2++) sf(al[i]+dx2, al[j]+dy2, Math.max(Math.abs(dx2),Math.abs(dy2))!==1); }
    function fmt(mask){ var d=(0<<3)|mask, r=d; for(var i=0;i<10;i++) r=(r<<1)^((r>>>9)*0x537); var b=((d<<10)|r)^0x5412; function g(i){return ((b>>>i)&1)!==0;}
      for(i=0;i<=5;i++) sf(8,i,g(i)); sf(8,7,g(6)); sf(8,8,g(7)); sf(7,8,g(8)); for(i=9;i<15;i++) sf(14-i,8,g(i));
      for(i=0;i<8;i++) sf(size-1-i,8,g(i)); for(i=8;i<15;i++) sf(8,size-15+i,g(i)); sf(8,size-8,true); }
    fmt(0);
    if(v>=7){ var r=v; for(i=0;i<12;i++) r=(r<<1)^((r>>>11)*0x1F25); var vb=(v<<12)|r; for(i=0;i<18;i++){ var bt=((vb>>>i)&1)!==0, a=size-11+i%3, bb=Math.floor(i/3); sf(a,bb,bt); sf(bb,a,bt); } }
    var bi=0; for(var right=size-1; right>=1; right-=2){ if(right===6) right=5; for(var vert=0; vert<size; vert++) for(j=0;j<2;j++){ var x=right-j, up=((right+1)&2)===0, y=up?size-1-vert:vert; if(!F[y][x] && bi<cw.length*8){ M[y][x]=((cw[bi>>>3]>>>(7-(bi&7)))&1)!==0; bi++; } } }
    var mask=2; for(y=0;y<size;y++) for(x=0;x<size;x++){ if(!F[y][x] && x%3===0) M[y][x]=!M[y][x]; }
    fmt(mask);
    return M;
  }
  function svg(text){
    var M=make(text); if(!M) return "";
    var n=M.length, q=4, s=n+2*q, d="";
    for(var y=0;y<n;y++) for(var x=0;x<n;x++) if(M[y][x]) d+="M"+(x+q)+" "+(y+q)+"h1v1h-1z";
    return "<svg viewBox='0 0 "+s+" "+s+"' shape-rendering='crispEdges' role='img' aria-label='QR-Code zur Schüleransicht'><rect width='"+s+"' height='"+s+"' fill='#fff'/><path d='"+d+"' fill='#000'/></svg>";
  }
  return { make: make, svg: svg };
})();

function startBeamer(){
  document.body.classList.add("beamer");
  $("#app").classList.add("hidden");
  const root = $("#beamerRoot"); root.classList.remove("hidden");
  const link = location.href.split("#")[0];
  root.innerHTML = '<div id="beamer"><div><h1>' + esc(CONFIG.meta.title) + '</h1><p class="sub">' + esc(CONFIG.meta.subtitle) + '</p><div class="bw"><canvas id="bWorld" width="448" height="288" style="width:100%;display:block;image-rendering:pixelated"></canvas></div>' +
    '<div class="card2" style="margin-top:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div id="bQR" style="background:#fff;padding:10px;border-radius:10px;width:220px;height:220px;flex:0 0 220px">' + QR.svg(link) + '</div><div style="flex:1;min-width:240px"><h2>Link für eure iPads</h2><p style="margin:0 0 8px;font-size:20px">QR-Code scannen oder Adresse eingeben:</p><div id="bLink">' + esc(link) + '</div></div></div></div>' +
    '<div><div class="card2"><h2>Zeit und Musik</h2><div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><div id="bTimer">0:00</div><div class="row" style="margin:0"><button id="bStart" class="btn gold" type="button">Start</button><button id="bReset" class="btn ghost" type="button" style="color:#fff;border-color:#fff">Zurücksetzen</button></div></div><p style="margin:10px 0 6px;font-size:20px">Spielmusik: „Die Gedanken sind frei“</p><div class="row" style="margin:0"><button id="bMusic" class="btn gold" type="button">▶ Musik an</button><label style="display:flex;align-items:center;gap:10px;font-size:20px">Lautstärke <input id="bVol" type="range" min="0" max="1" step="0.05" value="0.5"></label></div><p style="margin:12px 0 6px;font-size:20px">Zum Abschluss: Nationalhymne</p><div class="row" style="margin:0"><button id="bHymn" class="btn ghost" type="button" style="color:#fff;border-color:#e2b33c">▶ Nationalhymne abspielen</button></div></div>' +
    '<div class="card2"><h2>So geht\'s</h2><ol><li>Link öffnen, Teamnamen eingeben.</li><li>Zur markierten Station laufen und „Betreten“ tippen.</li><li>Aufgaben lösen, Stempel sammeln, Sicherungsblatt ausfüllen.</li><li>Am Ausgang das Lösungswort eingeben.</li></ol></div>' +
    '<div class="card2"><h2>Rollen – wechseln nach jeder Station</h2><ul><li><b>Steuerung:</b> bedient das iPad</li><li><b>Grundgesetz:</b> liest im Dossier</li><li><b>Akte:</b> liest Fall und Material vor</li><li><b>Protokoll:</b> füllt das Sicherungsblatt aus</li></ul></div>' +
    '</div></div>';
  const musicUi = () => { $("#bMusic").textContent = Music.song === "gedanken" ? "⏸ Musik aus" : "▶ Musik an"; $("#bHymn").textContent = Music.song === "hymne" ? "⏹ Hymne stoppen" : "▶ Nationalhymne abspielen"; };
  $("#bMusic").addEventListener("click", () => {
    if (Music.song === "gedanken") Music.stop();
    else if (!Music.play("gedanken")) toast("Dieser Browser kann keine Musik erzeugen.");
    musicUi();
  });
  $("#bHymn").addEventListener("click", () => {
    if (Music.song === "hymne") Music.stop();
    else if (!Music.play("hymne", musicUi)) toast("Dieser Browser kann keine Musik erzeugen.");
    musicUi();
  });
  $("#bVol").addEventListener("input", e => Music.setVolume(parseFloat(e.target.value)));
  let tStart = 0, tAcc = 0, running = false;
  const show = () => { $("#bTimer").textContent = fmtTime(tAcc + (running ? Date.now() - tStart : 0)); };
  $("#bStart").addEventListener("click", () => { if (running){ tAcc += Date.now() - tStart; running = false; $("#bStart").textContent = "Weiter"; } else { tStart = Date.now(); running = true; $("#bStart").textContent = "Pause"; } show(); });
  $("#bReset").addEventListener("click", () => { running = false; tAcc = 0; $("#bStart").textContent = "Start"; show(); });
  setInterval(show, 500);
  /* Demo-Figur läuft von Gebäude zu Gebäude */
  buildGrid(); S = freshState(); renderBackground();
  const c = $("#bWorld").getContext("2d"), demo = makePlayer(null), order = ["pav","pz","fs","rh","vh","bt","br","aus","zus"]; let oi = 0, last = 0;
  const go = () => { walkTo(demo, order[oi % order.length], () => setTimeout(go, 700)); oi++; };
  go();
  const loop = ts => { const t = ts / 1000, dt = Math.min(0.05, last ? t - last : 0); last = t; stepPlayer(demo, dt); c.imageSmoothingEnabled = false; c.drawImage(bgCanvas, 0, 0); drawPlayer(c, demo); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

function init(){
  if (/beamer/i.test(location.hash) || /beamer/i.test(location.search)){ startBeamer(); return; }
  $("#app").classList.remove("hidden");
  const saved = store.get();
  if (saved && saved.v === 1) S = Object.assign(freshState(), saved);
  buildGrid();
  let pos = S.pos;
  if (pos && (isSolidPx(pos.x - 5, pos.y - 4) || isSolidPx(pos.x + 5, pos.y))) pos = null;
  player = makePlayer(pos);
  worldCtx = $("#world").getContext("2d");
  refreshWorld(); bindInputs(); renderMusicBtn();
  /* Browser spielen Ton erst nach einer Berührung: gespeicherte Einstellung „Musik an“ beim ersten Antippen fortsetzen */
  if (S.music){ const resume = () => { updateMusic(); document.removeEventListener("pointerdown", resume, true); document.removeEventListener("keydown", resume, true); }; document.addEventListener("pointerdown", resume, true); document.addEventListener("keydown", resume, true); }
  rafId = requestAnimationFrame(frame);
  const ww = $("#worldWrap"), fitLabels = () => ww.classList.toggle("compact", ww.clientWidth < 680);
  fitLabels(); window.addEventListener("resize", fitLabels); if (window.ResizeObserver) new ResizeObserver(fitLabels).observe(ww);
  setInterval(() => { if (S.start && !modalOpen()) save(); }, 5000);
  window.addEventListener("pagehide", save);
  if (!S.group) openStart();
  else if (!S.introSeen) openIntro();
  else if (S.finish) showEnd(false);
}
document.addEventListener("DOMContentLoaded", init);
